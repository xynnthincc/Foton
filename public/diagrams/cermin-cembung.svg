<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Cermin cembung dengan titik fokus maya">
  <defs>
    <style>
      .txt { font-family: system-ui, sans-serif; font-size: 13px; fill: #e5e0d6; }
      .txtb { font-family: system-ui, sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .axis { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 6 4; }
      .mirror { fill: none; stroke: #e5e0d6; stroke-width: 2.5; }
      .ray { stroke: #6ba3c0; stroke-width: 1.6; marker-end: url(#a); }
      .ref { stroke: #d97757; stroke-width: 1.6; marker-end: url(#b); }
      .dash { stroke: #d97757; stroke-width: 1.4; stroke-dasharray: 4 3; }
      .pt { fill: #d97757; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6ba3c0" /></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d97757" /></marker>
  </defs>

  <line class="axis" x1="20" y1="160" x2="580" y2="160" />
  <text class="txt" x="555" y="150">sumbu utama</text>

  <path class="mirror" d="M 520,60 C 540,110 540,210 520,260" />
  <text class="txt" x="525" y="55">cermin</text>

  <circle class="pt" cx="460" cy="160" r="4" />
  <text class="txtb" x="452" y="185">F (maya)</text>
  <circle class="pt" cx="400" cy="160" r="4" />
  <text class="txtb" x="392" y="185">C (maya)</text>

  <line stroke="#7fb069" stroke-width="2" x1="140" y1="160" x2="140" y2="90" />
  <polygon points="134,96 140,84 146,96" fill="#7fb069" />
  <text class="txt" x="125" y="78">benda</text>

  <line class="ray" x1="140" y1="90" x2="520" y2="90" />
  <line class="ref" x1="520" y1="90" x2="460" y2="160" />
  <line class="dash" x1="460" y1="160" x2="280" y2="300" />

  <line class="ray" x1="140" y1="90" x2="520" y2="160" />
  <line class="ref" x1="520" y1="160" x2="460" y2="160" />

  <text class="txt" x="250" y="290">bayangan maya (tegak, diminutive)</text>
</svg>
