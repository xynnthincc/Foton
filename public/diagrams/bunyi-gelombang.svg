<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"
     aria-label="Gelombang bunyi longitudinal dengan area kompresi dan rarefaksi, amplitudo, dan panjang gelombang">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-bg); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-bg); }
      .hs  { stroke: #e8b86d; stroke-width: 1.8; marker-end: url(#va-bg); }
      .ext { stroke: #7fb069; stroke-width: 1.8; marker-end: url(#vg-bg); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .sb  { font-size: 11px; }
    </style>
    <marker id="vb-bg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-bg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="va-bg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
    <marker id="vg-bg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
    <marker id="vd2-bg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8a857d"/>
    </marker>
  </defs>

  <text class="tb" x="40" y="28">Gelombang bunyi longitudinal</text>
  <text class="ts" x="40" y="46">partikel sejajar arah rambat</text>

  <!-- panjang gelombang -->
  <text class="ts" x="300" y="46" text-anchor="middle">panjang gelombang</text>
  <text class="t" x="300" y="66" text-anchor="middle" style="font-size:15px;font-weight:700">&#955;</text>
  <line class="dim" x1="144" y1="74" x2="312" y2="74"
        marker-end="url(#vd2-bg)" marker-start="url(#vd2-bg)"/>
  <line class="dim" stroke-dasharray="3 3" x1="144" y1="80" x2="144" y2="160"/>
  <line class="dim" stroke-dasharray="3 3" x1="312" y1="80" x2="312" y2="160"/>

  <!-- amplitudo A -->
  <line x1="48" y1="148" x2="48" y2="170" stroke="#8a857d" stroke-width="1"
        marker-end="url(#vd2-bg)" marker-start="url(#vd2-bg)"/>
  <text class="tb" x="40" y="163" text-anchor="end">A</text>

  <!-- sumbu medium -->
  <line x1="30" y1="170" x2="570" y2="170" stroke="#8a857d" stroke-width="1.5"/>

  <!-- partikel: rapat = kompresi, renggang = rarefaksi -->
  <g fill="#e5e0d6">
    <circle cx="60.0" cy="170" r="4.5"/>
    <circle cx="94.9" cy="170" r="4.5"/>
    <circle cx="121.6" cy="170" r="4.5"/>
    <circle cx="138.1" cy="170" r="4.5"/>
    <circle cx="149.9" cy="170" r="4.5"/>
    <circle cx="166.4" cy="170" r="4.5"/>
    <circle cx="193.1" cy="170" r="4.5"/>
    <circle cx="228.0" cy="170" r="4.5"/>
    <circle cx="262.9" cy="170" r="4.5"/>
    <circle cx="289.7" cy="170" r="4.5"/>
    <circle cx="306.1" cy="170" r="4.5"/>
    <circle cx="317.9" cy="170" r="4.5"/>
    <circle cx="334.4" cy="170" r="4.5"/>
    <circle cx="361.1" cy="170" r="4.5"/>
    <circle cx="396.0" cy="170" r="4.5"/>
    <circle cx="431.0" cy="170" r="4.5"/>
    <circle cx="457.7" cy="170" r="4.5"/>
    <circle cx="474.1" cy="170" r="4.5"/>
    <circle cx="485.9" cy="170" r="4.5"/>
    <circle cx="502.4" cy="170" r="4.5"/>
    <circle cx="529.1" cy="170" r="4.5"/>
  </g>

  <!-- simpangan beberapa partikel: kanan saat kompresi, kiri saat rarefaksi -->
  <line class="vd" x1="121.6" y1="148" x2="135.3" y2="148"/>
  <line class="vd" x1="166.4" y1="148" x2="152.7" y2="148"/>
  <line class="vd" x1="289.7" y1="148" x2="303.3" y2="148"/>
  <line class="vd" x1="334.4" y1="148" x2="320.7" y2="148"/>
  <line class="vd" x1="457.7" y1="148" x2="471.3" y2="148"/>
  <line class="vd" x1="502.4" y1="148" x2="488.7" y2="148"/>
  <text class="ts" x="110" y="134" text-anchor="end">simpangan partikel</text>

  <!-- jarak normal (partikel setimbang) -->
  <g stroke="#8a857d" stroke-width="1.5">
    <line x1="60" y1="190" x2="60" y2="200"/>
    <line x1="84" y1="190" x2="84" y2="200"/>
    <line x1="108" y1="190" x2="108" y2="200"/>
    <line x1="132" y1="190" x2="132" y2="200"/>
    <line x1="156" y1="190" x2="156" y2="200"/>
    <line x1="180" y1="190" x2="180" y2="200"/>
    <line x1="204" y1="190" x2="204" y2="200"/>
    <line x1="228" y1="190" x2="228" y2="200"/>
    <line x1="252" y1="190" x2="252" y2="200"/>
    <line x1="276" y1="190" x2="276" y2="200"/>
    <line x1="300" y1="190" x2="300" y2="200"/>
    <line x1="324" y1="190" x2="324" y2="200"/>
    <line x1="348" y1="190" x2="348" y2="200"/>
    <line x1="372" y1="190" x2="372" y2="200"/>
    <line x1="396" y1="190" x2="396" y2="200"/>
    <line x1="420" y1="190" x2="420" y2="200"/>
    <line x1="444" y1="190" x2="444" y2="200"/>
    <line x1="468" y1="190" x2="468" y2="200"/>
    <line x1="492" y1="190" x2="492" y2="200"/>
    <line x1="516" y1="190" x2="516" y2="200"/>
    <line x1="540" y1="190" x2="540" y2="200"/>
  </g>
  <text class="ts" x="60" y="214">jarak normal (partikel setimbang)</text>

  <!-- area kompresi dan rarefaksi -->
  <g stroke="#8a857d" stroke-width="1">
    <path d="M 130,240 L 130,234 L 158,234 L 158,240" fill="none"/>
    <path d="M 200,240 L 200,234 L 232,234 L 232,240" fill="none"/>
    <path d="M 298,240 L 298,234 L 326,234 L 326,240" fill="none"/>
    <path d="M 368,240 L 368,234 L 400,234 L 400,240" fill="none"/>
  </g>
  <text class="tb" x="144" y="256" text-anchor="middle">kompresi (rapatan)</text>
  <text class="tb" x="312" y="256" text-anchor="middle">kompresi (rapatan)</text>
  <line x1="216" y1="244" x2="216" y2="268" stroke="#8a857d" stroke-width="1"/>
  <line x1="384" y1="244" x2="384" y2="268" stroke="#8a857d" stroke-width="1"/>
  <text class="tb" x="216" y="280" text-anchor="middle">rarefaksi (renggangan)</text>
  <text class="tb" x="384" y="280" text-anchor="middle">rarefaksi (renggangan)</text>

  <!-- arah rambat dan kecepatan rambat -->
  <text class="tb" x="80" y="302">arah rambat gelombang</text>
  <line class="ln" x1="80" y1="312" x2="340" y2="312" marker-end="url(#va-bg)"/>
  <text class="t" x="350" y="316">v = kecepatan rambat</text>
</svg>