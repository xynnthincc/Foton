<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-label="Dua bejana gas dengan jumlah partikel sama: volume besar memberi tekanan kecil, volume kecil memberi tekanan besar, memenuhi pV = nRT">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-gip); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-gip); }
      .hs  { stroke: #e8b86d; stroke-width: 1.8; marker-end: url(#va-gip); }
      .ext { stroke: #7fb069; stroke-width: 1.8; marker-end: url(#vg-gip); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <marker id="vb-gip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-gip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="va-gip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
    <marker id="vg-gip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
  </defs>

  <line class="ax" x1="300" y1="18" x2="300" y2="228"/>

  <!-- ============ PANEL KIRI: VOLUME BESAR ============ -->
  <text class="tb" x="150" y="26" text-anchor="middle">VOLUME BESAR</text>
  <text class="ts" x="150" y="40" text-anchor="middle">suhu T tetap</text>

  <rect x="30" y="48" width="240" height="88" rx="4" fill="#6ba3c0" fill-opacity="0.06" stroke="#e5e0d6" stroke-width="1.5"/>

  <g fill="#6ba3c0">
    <circle cx="50" cy="66" r="2.8"/><circle cx="79" cy="66" r="2.8"/>
    <circle cx="107" cy="66" r="2.8"/><circle cx="136" cy="66" r="2.8"/>
    <circle cx="164" cy="66" r="2.8"/><circle cx="193" cy="66" r="2.8"/>
    <circle cx="221" cy="66" r="2.8"/><circle cx="250" cy="66" r="2.8"/>
    <circle cx="50" cy="92" r="2.8"/><circle cx="79" cy="92" r="2.8"/>
    <circle cx="107" cy="92" r="2.8"/><circle cx="136" cy="92" r="2.8"/>
    <circle cx="164" cy="92" r="2.8"/><circle cx="193" cy="92" r="2.8"/>
    <circle cx="221" cy="92" r="2.8"/><circle cx="250" cy="92" r="2.8"/>
    <circle cx="50" cy="118" r="2.8"/><circle cx="79" cy="118" r="2.8"/>
    <circle cx="107" cy="118" r="2.8"/><circle cx="136" cy="118" r="2.8"/>
    <circle cx="164" cy="118" r="2.8"/><circle cx="193" cy="118" r="2.8"/>
    <circle cx="221" cy="118" r="2.8"/><circle cx="250" cy="118" r="2.8"/>
  </g>

  <text class="t" x="150" y="158" text-anchor="middle">T sama, V besar</text>
  <text class="ts" x="150" y="176" text-anchor="middle">jarak antarpartikel besar</text>
  <text class="acc" x="150" y="196" text-anchor="middle">p kecil</text>
  <text class="ts" x="150" y="216" text-anchor="middle">n = 24 partikel, tetap sama</text>

  <!-- ============ PANEL KANAN: VOLUME KECIL ============ -->
  <text class="tb" x="460" y="26" text-anchor="middle">VOLUME KECIL</text>
  <text class="ts" x="460" y="40" text-anchor="middle">suhu T tetap</text>

  <rect x="400" y="48" width="120" height="88" rx="4" fill="#d97757" fill-opacity="0.06" stroke="#e5e0d6" stroke-width="1.5"/>

  <g fill="#d97757">
    <circle cx="412" cy="66" r="2.8"/><circle cx="426" cy="66" r="2.8"/>
    <circle cx="439" cy="66" r="2.8"/><circle cx="453" cy="66" r="2.8"/>
    <circle cx="467" cy="66" r="2.8"/><circle cx="480" cy="66" r="2.8"/>
    <circle cx="494" cy="66" r="2.8"/><circle cx="508" cy="66" r="2.8"/>
    <circle cx="412" cy="92" r="2.8"/><circle cx="426" cy="92" r="2.8"/>
    <circle cx="439" cy="92" r="2.8"/><circle cx="453" cy="92" r="2.8"/>
    <circle cx="467" cy="92" r="2.8"/><circle cx="480" cy="92" r="2.8"/>
    <circle cx="494" cy="92" r="2.8"/><circle cx="508" cy="92" r="2.8"/>
    <circle cx="412" cy="118" r="2.8"/><circle cx="426" cy="118" r="2.8"/>
    <circle cx="439" cy="118" r="2.8"/><circle cx="453" cy="118" r="2.8"/>
    <circle cx="467" cy="118" r="2.8"/><circle cx="480" cy="118" r="2.8"/>
    <circle cx="494" cy="118" r="2.8"/><circle cx="508" cy="118" r="2.8"/>
  </g>

  <text class="t" x="460" y="158" text-anchor="middle">T sama, V kecil</text>
  <text class="ts" x="460" y="176" text-anchor="middle">jarak antarpartikel kecil</text>
  <text class="acc" x="460" y="196" text-anchor="middle">p besar</text>
  <text class="ts" x="460" y="216" text-anchor="middle">n = 24 partikel, tetap sama</text>

  <!-- hukum gas ideal -->
  <text class="acc" x="150" y="240" text-anchor="middle">pV = nRT</text>
  <text class="acc" x="460" y="240" text-anchor="middle">p ~ 1/V (T tetap)</text>
</svg>
