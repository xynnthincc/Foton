<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="Efek rumah kaca: sinar matahari masuk lewat kaca, radiasi infra merah tertahan dan dipantulkan kembali sehingga suhu di dalam lebih tinggi dari suhu luar">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-pgrk); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-pgrk); }
      .hs  { stroke: #e8b86d; stroke-width: 1.8; marker-end: url(#va-pgrk); }
      .ext { stroke: #7fb069; stroke-width: 1.8; marker-end: url(#vg-pgrk); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <marker id="vb-pgrk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-pgrk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="va-pgrk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
    <marker id="vg-pgrk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
  </defs>

  <text class="tb" x="20" y="26">Efek rumah kaca (greenhouse)</text>

  <!-- matahari -->
  <circle cx="64" cy="64" r="17" fill="#e8b86d"/>
  <g stroke="#e8b86d" stroke-width="1.8" stroke-linecap="round">
    <line x1="85" y1="64" x2="93" y2="64"/>
    <line x1="79" y1="79" x2="84" y2="84"/>
    <line x1="64" y1="85" x2="64" y2="93"/>
    <line x1="49" y1="79" x2="44" y2="84"/>
    <line x1="43" y1="64" x2="35" y2="64"/>
    <line x1="49" y1="49" x2="44" y2="44"/>
    <line x1="64" y1="43" x2="64" y2="35"/>
    <line x1="79" y1="49" x2="84" y2="44"/>
  </g>
  <text class="ts" x="64" y="112" text-anchor="middle">matahari</text>

  <!-- sinar matahari masuk lewat kaca -->
  <line class="hs" x1="84" y1="54" x2="290" y2="115"/>
  <line class="hs" x1="85" y1="66" x2="240" y2="130"/>
  <line class="hs" x1="84" y1="78" x2="190" y2="146"/>

  <!-- rumah kaca: atap + dinding kaca + lantai -->
  <path d="M 148,248 L 148,158 L 340,96 L 532,158 L 532,248" fill="none" stroke="#6ba3c0" stroke-width="2" stroke-linejoin="round"/>
  <rect x="148" y="242" width="384" height="6" fill="#2a2926"/>
  <text class="ts" x="140" y="150" text-anchor="end">kaca</text>
  <text class="ts" x="140" y="230" text-anchor="end">suhu dalam</text>
  <text class="ts" x="585" y="230" text-anchor="end">suhu luar</text>

  <!-- tumbuhan di dalam rumah kaca -->
  <line x1="200" y1="242" x2="200" y2="196" stroke="#7fb069" stroke-width="2"/>
  <ellipse cx="186" cy="206" rx="12" ry="5" fill="#7fb069" transform="rotate(-28 186 206)"/>
  <ellipse cx="214" cy="196" rx="12" ry="5" fill="#7fb069" transform="rotate(28 214 196)"/>
  <ellipse cx="188" cy="188" rx="10" ry="4.5" fill="#7fb069" transform="rotate(-28 188 188)"/>
  <ellipse cx="212" cy="178" rx="10" ry="4.5" fill="#7fb069" transform="rotate(28 212 178)"/>
  <line x1="250" y1="242" x2="250" y2="202" stroke="#7fb069" stroke-width="2"/>
  <ellipse cx="236" cy="212" rx="12" ry="5" fill="#7fb069" transform="rotate(-28 236 212)"/>
  <ellipse cx="264" cy="202" rx="12" ry="5" fill="#7fb069" transform="rotate(28 264 202)"/>
  <ellipse cx="238" cy="196" rx="10" ry="4.5" fill="#7fb069" transform="rotate(-28 238 196)"/>
  <ellipse cx="262" cy="186" rx="10" ry="4.5" fill="#7fb069" transform="rotate(28 262 186)"/>

  <!-- termometer: suhu di dalam naik -->
  <text class="acc" x="470" y="162" text-anchor="middle">suhu naik</text>
  <rect x="466" y="170" width="8" height="68" fill="#e5e0d6" fill-opacity="0.15" stroke="#e5e0d6" stroke-width="1"/>
  <rect x="468" y="200" width="4" height="38" fill="#c97064"/>
  <circle cx="470" cy="240" r="8" fill="#c97064"/>

  <!-- radiasi IR naik ke atap, dipantulkan kembali ke bawah -->
  <path class="fa" d="M 318,238 q 10,0 0,-22 t 0,-22 t 0,-22 t 0,-22 t 0,-22 t 0,-22"/>
  <path class="gh" d="M 348,104 q -10,0 0,22 t 0,22 t 0,22 t 0,22 t 0,22 t 0,22" marker-end="url(#fa-pgrk)"/>
  <circle cx="333" cy="101" r="3" fill="#c97064"/>
  <text class="acc" x="340" y="84" text-anchor="middle">radiasi IR tertahan</text>

  <!-- sebagian radiasi tetap lolos keluar -->
  <path d="M 420,220 q 10,0 0,-22 t 0,-22 t 0,-22 t 0,-22 t 0,-22 t 0,-22 t 0,-22 t 0,-22" fill="none" stroke="#c97064" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polygon points="420,40 415,49 425,49" fill="#c97064"/>
  <text class="ts" x="432" y="52">sebagian lolos</text>

  <text class="acc" x="340" y="278" text-anchor="middle">panas tertahan -&gt; suhu naik</text>
  <text class="t" x="340" y="306" text-anchor="middle">suhu di dalam &gt; suhu luar</text>
</svg>
