<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"
     aria-label="Tumbukan satu dimensi: panel sebelum dan sesudah tumbukan serta persamaan kekekalan momentum">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-mt); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-mt); }
      .hs  { stroke: #e8b86d; stroke-width: 1.8; marker-end: url(#va-mt); }
      .ext { stroke: #7fb069; stroke-width: 1.8; marker-end: url(#vg-mt); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .sb  { font-size: 11px; }
    </style>
    <marker id="vb-mt" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-mt" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="va-mt" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
    <marker id="vg-mt" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
    <marker id="vd2-mt" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8a857d"/>
    </marker>
  </defs>

  <!-- pemisah panel -->
  <line class="ax" x1="300" y1="56" x2="300" y2="210"/>

  <!-- ============ PANEL KIRI: SEBELUM ============ -->
  <text class="tb" x="160" y="76" text-anchor="middle">SEBELUM</text>
  <line class="ax" x1="36" y1="176" x2="284" y2="176"/>

  <!-- balok m1 -->
  <rect x="54" y="132" width="58" height="44" rx="4" fill="#2a2926" stroke="#6ba3c0" stroke-width="2"/>
  <text class="t" x="83" y="159" text-anchor="middle">m&#8321;</text>
  <!-- balok m2 -->
  <rect x="194" y="132" width="58" height="44" rx="4" fill="#2a2926" stroke="#7fb069" stroke-width="2"/>
  <text class="t" x="223" y="159" text-anchor="middle">m&#8322;</text>

  <!-- kecepatan m1 sebelum (panah panjang = momentum besar) -->
  <line class="vd" x1="83" y1="112" x2="149" y2="112"/>
  <text class="t" x="116" y="100" text-anchor="middle" style="fill:#6ba3c0">v<tspan dy="4" class="sb">1i</tspan></text>
  <!-- m2 diam -->
  <text class="ts" x="223" y="100" text-anchor="middle">v<tspan dy="4" class="sb">2i</tspan><tspan dy="-4"> = 0 (diam)</tspan></text>

  <text class="ts" x="83" y="194" text-anchor="middle">3 kg</text>
  <text class="ts" x="223" y="194" text-anchor="middle">2 kg</text>

  <!-- ============ PANEL KANAN: SESUDAH ============ -->
  <text class="tb" x="440" y="76" text-anchor="middle">SESUDAH</text>
  <line class="ax" x1="316" y1="176" x2="564" y2="176"/>

  <rect x="330" y="132" width="58" height="44" rx="4" fill="#2a2926" stroke="#6ba3c0" stroke-width="2"/>
  <text class="t" x="359" y="159" text-anchor="middle">m&#8321;</text>
  <rect x="470" y="132" width="58" height="44" rx="4" fill="#2a2926" stroke="#7fb069" stroke-width="2"/>
  <text class="t" x="499" y="159" text-anchor="middle">m&#8322;</text>

  <!-- kecepatan m1 sesudah (momentum kecil -> panah pendek) -->
  <line class="vd" x1="359" y1="112" x2="372" y2="112"/>
  <text class="t" x="377" y="100" style="fill:#6ba3c0">v<tspan dy="4" class="sb">1f</tspan></text>
  <!-- kecepatan m2 sesudah (momentum besar -> panah panjang) -->
  <line class="ext" x1="499" y1="112" x2="552" y2="112"/>
  <text class="t" x="525" y="100" text-anchor="middle" style="fill:#7fb069">v<tspan dy="4" class="sb">2f</tspan></text>

  <text class="ts" x="359" y="194" text-anchor="middle">3 kg</text>
  <text class="ts" x="499" y="194" text-anchor="middle">2 kg</text>

  <!-- ============ PERSAMAAN KEKEKALAN ============ -->
  <line class="ax" x1="40" y1="216" x2="560" y2="216"/>
  <text class="acc" x="300" y="244" text-anchor="middle">m<tspan dy="4" class="sb">1</tspan><tspan dy="-4">v</tspan><tspan dy="4" class="sb">1i</tspan><tspan dy="-4"> + m</tspan><tspan dy="4" class="sb">2</tspan><tspan dy="-4">v</tspan><tspan dy="4" class="sb">2i</tspan><tspan dy="-4"> = m</tspan><tspan dy="4" class="sb">1</tspan><tspan dy="-4">v</tspan><tspan dy="4" class="sb">1f</tspan><tspan dy="-4"> + m</tspan><tspan dy="4" class="sb">2</tspan><tspan dy="-4">v</tspan><tspan dy="4" class="sb">2f</tspan></text>
  <text class="ts" x="300" y="266" text-anchor="middle">dengan v<tspan dy="4" class="sb">2i</tspan><tspan dy="-4"> = 0,  m</tspan><tspan dy="4" class="sb">1</tspan><tspan dy="-4"> = 3 kg,  m</tspan><tspan dy="4" class="sb">2</tspan><tspan dy="-4"> = 2 kg,  tumbukan lenting sempurna</tspan></text>

  <!-- catatan momentum -->
  <text class="tb" x="300" y="298" text-anchor="middle">Panjang panah sebanding dengan momentum: p = m &#215; v</text>
  <text class="ts" x="300" y="320" text-anchor="middle">sebelum: 3 m v + 0 = 3 m v &#160;&#160;&#160;&#8594;&#160;&#160;&#160; sesudah: 0,6 m v + 2,4 m v = 3 m v</text>
</svg>