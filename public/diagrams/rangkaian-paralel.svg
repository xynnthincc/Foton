<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="Rangkaian paralel: baterai dengan dua cabang hambatan R1 dan R2, arus I bercabang menjadi I1 dan I2, tegangan pada kedua cabang sama sehingga V1 = V2 = V total">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .w   { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .cur { stroke: #6ba3c0; stroke-width: 2; fill: none; marker-end: url(#arr-pc); }
      .res { fill: #c97064; stroke: #e5e0d6; stroke-width: 1.5; }
      .pl  { stroke: #e5e0d6; stroke-width: 3; }
      .nd  { fill: #e8b86d; }
    </style>
    <marker id="arr-pc" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
  </defs>

  <text class="tb" x="20" y="26">Rangkaian paralel</text>
  <text class="ts" x="20" y="46">dua jalur - tegangan sama pada tiap cabang</text>

  <!-- katas atas dan bawah -->
  <line class="w" x1="90" y1="100" x2="510" y2="100"/>
  <line class="w" x1="90" y1="250" x2="510" y2="250"/>
  <!-- kawat kanan -->
  <line class="w" x1="510" y1="100" x2="510" y2="250"/>
  <!-- kawat kiri atas dan bawah baterai -->
  <line class="w" x1="90" y1="250" x2="90" y2="180"/>
  <line class="w" x1="90" y1="150" x2="90" y2="100"/>

  <!-- baterai -->
  <line class="pl" x1="66" y1="150" x2="114" y2="150"/>
  <line class="pl" x1="78" y1="180" x2="102" y2="180"/>
  <text class="acc" x="58" y="155" text-anchor="end">+</text>
  <text class="ts" x="58" y="185" text-anchor="end">-</text>
  <text class="ts" x="90" y="225" text-anchor="middle">baterai</text>

  <!-- cabang 1 -->
  <line class="w" x1="210" y1="100" x2="210" y2="140"/>
  <rect class="res" x="198" y="140" width="24" height="70" rx="3"/>
  <line class="w" x1="210" y1="210" x2="210" y2="250"/>
  <text class="t" x="210" y="132" text-anchor="middle">R₁</text>
  <text class="ts" x="236" y="180">tegangan V₁</text>

  <!-- cabang 2 -->
  <line class="w" x1="370" y1="100" x2="370" y2="140"/>
  <rect class="res" x="358" y="140" width="24" height="70" rx="3"/>
  <line class="w" x1="370" y1="210" x2="370" y2="250"/>
  <text class="t" x="370" y="132" text-anchor="middle">R₂</text>
  <text class="ts" x="396" y="180">tegangan V₂</text>

  <!-- simpul -->
  <circle class="nd" cx="210" cy="100" r="4"/>
  <circle class="nd" cx="370" cy="100" r="4"/>
  <circle class="nd" cx="210" cy="250" r="4"/>
  <circle class="nd" cx="370" cy="250" r="4"/>
  <text class="ts" x="468" y="122" text-anchor="end">simpul</text>
  <text class="ts" x="468" y="136" text-anchor="end">(garis penuh)</text>

  <!-- arah arus bercabang -->
  <line class="cur" x1="120" y1="100" x2="170" y2="100"/>
  <text class="t" x="145" y="90" text-anchor="middle" style="fill:#6ba3c0">I</text>
  <line class="cur" x1="210" y1="112" x2="210" y2="134"/>
  <text class="t" x="196" y="128" text-anchor="end" style="fill:#6ba3c0">I₁</text>
  <line class="cur" x1="370" y1="112" x2="370" y2="134"/>
  <text class="t" x="356" y="128" text-anchor="end" style="fill:#6ba3c0">I₂</text>

  <text class="t" x="300" y="288" text-anchor="middle">hambatan R yang besar justru menambah arus total</text>
  <text class="ts" x="300" y="306" text-anchor="middle">dua hambatan sama nilainya -&gt; R total = R / 2</text>

  <!-- ringkasan -->
  <text class="acc" x="20" y="292">1/R total = 1/R₁ + 1/R₂</text>
  <text class="acc" x="20" y="314">V₁ = V₂ = V total</text>
  <text class="t" x="320" y="292">tegangan sama</text>
  <text class="t" x="320" y="314">arus terbagi: I = I₁ + I₂</text>
</svg>