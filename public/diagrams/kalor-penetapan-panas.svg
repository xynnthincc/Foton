<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="Tiga cara perpindahan panas: konduksi pada padatan, konveksi pada fluida, dan radiasi tanpa media">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-kp); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-kp); }
      .hs  { stroke: #e8b86d; stroke-width: 1.8; marker-end: url(#va-kp); }
      .ext { stroke: #7fb069; stroke-width: 1.8; marker-end: url(#vg-kp); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <marker id="vb-kp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-kp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="va-kp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
    <marker id="vg-kp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
  </defs>

  <line class="ax" x1="200" y1="32" x2="200" y2="302"/>
  <line class="ax" x1="400" y1="32" x2="400" y2="302"/>

  <!-- ================= PANEL 1: KONDUKSI ================= -->
  <text class="tb" x="100" y="48" text-anchor="middle">KONDUKSI</text>
  <text class="ts" x="100" y="66" text-anchor="middle">konduksi (padat)</text>

  <text class="acc" x="16" y="84">suhu tinggi</text>
  <text class="acc" x="184" y="84" text-anchor="end">suhu rendah</text>

  <!-- batang logam -->
  <rect x="16" y="92" width="42" height="46" fill="#e8b86d" stroke="#e5e0d6" stroke-width="1.5"/>
  <rect x="58" y="92" width="84" height="46" fill="#e5e0d6" fill-opacity="0.12" stroke="#e5e0d6" stroke-width="1.5"/>
  <rect x="142" y="92" width="42" height="46" fill="#6ba3c0" stroke="#e5e0d6" stroke-width="1.5"/>

  <!-- partikel bergetar vigor di ujung panas -->
  <path d="M 24,102 l 4,-5 l 4,5 l 4,-5 l 4,5" fill="none" stroke="#2a2926" stroke-width="1.3"/>
  <circle cx="28" cy="112" r="3" fill="#2a2926"/>
  <circle cx="40" cy="112" r="3" fill="#2a2926"/>
  <circle cx="52" cy="112" r="3" fill="#2a2926"/>
  <!-- partikel di tengah -->
  <circle cx="72" cy="112" r="2.6" fill="#e5e0d6"/>
  <circle cx="88" cy="112" r="2.6" fill="#e5e0d6"/>
  <circle cx="104" cy="112" r="2.6" fill="#e5e0d6"/>
  <circle cx="120" cy="112" r="2.6" fill="#e5e0d6"/>
  <!-- partikel getar pelan di ujung dingin -->
  <circle cx="150" cy="112" r="2.2" fill="#2a2926"/>
  <circle cx="160" cy="112" r="2.2" fill="#2a2926"/>
  <circle cx="170" cy="112" r="2.2" fill="#2a2926"/>

  <!-- arah aliran kalor di dalam batang: panas ke dingin -->
  <line class="fa" x1="64" y1="152" x2="136" y2="152"/>
  <text class="acc" x="100" y="166" text-anchor="middle">Q</text>

  <text class="ts" x="16" y="190">getar vigor</text>
  <text class="ts" x="184" y="190" text-anchor="end">getar pelan</text>
  <text class="ts" x="100" y="212" text-anchor="middle">kalor: panas ke dingin</text>
  <text class="ts" x="100" y="232" text-anchor="middle">tanpa aliran materi</text>
  <text class="ts" x="100" y="252" text-anchor="middle">butuh kontak langsung</text>
  <text class="ts" x="100" y="270" text-anchor="middle">zat padat, mis. logam</text>
  <text class="ts" x="100" y="288" text-anchor="middle">partikel bergetar</text>

  <!-- ================= PANEL 2: KONEKSI ================= -->
  <text class="tb" x="300" y="48" text-anchor="middle">KONEKSI</text>
  <text class="ts" x="300" y="66" text-anchor="middle">konveksi (fluida)</text>

  <!-- bejana + fluida -->
  <rect x="220" y="100" width="160" height="100" fill="#6ba3c0" fill-opacity="0.35"/>
  <line x1="220" y1="100" x2="380" y2="100" stroke="#6ba3c0" stroke-width="1.5"/>
  <path class="ln" d="M 216,74 L 216,204 L 384,204 L 384,74"/>

  <!-- sirkulasi: turun di sisi kiri, naik di sisi kanan -->
  <path class="vd" d="M 272,114 C 252,136 252,168 272,188"/>
  <path class="hs" d="M 328,188 C 348,168 348,136 328,114"/>
  <text class="t" x="250" y="158" text-anchor="end" style="fill:#6ba3c0">Turun</text>
  <text class="t" x="350" y="158" style="fill:#e8b86d">Naik</text>

  <!-- pemanas di bawah bejana -->
  <rect x="250" y="212" width="100" height="10" rx="2" fill="#e8b86d" fill-opacity="0.25" stroke="#e8b86d" stroke-width="1.5"/>
  <line class="hs" x1="276" y1="224" x2="276" y2="198"/>
  <line class="hs" x1="300" y1="224" x2="300" y2="198"/>
  <line class="hs" x1="324" y1="224" x2="324" y2="198"/>
  <text class="acc" x="300" y="238" text-anchor="middle">Q dari pemanas</text>

  <text class="ts" x="300" y="258" text-anchor="middle">butuh media fluida</text>
  <text class="ts" x="300" y="276" text-anchor="middle">cair atau gas</text>
  <text class="ts" x="300" y="294" text-anchor="middle">aliran massa fluida</text>

  <!-- ================= PANEL 3: RADIASI ================= -->
  <text class="tb" x="500" y="48" text-anchor="middle">RADIASI</text>
  <text class="ts" x="500" y="66" text-anchor="middle">radiasi (tanpa media)</text>

  <!-- panci -->
  <path d="M 420,140 L 432,164 L 476,164 L 488,140 Z" fill="#e5e0d6" fill-opacity="0.14" stroke="#e5e0d6" stroke-width="2" stroke-linejoin="round"/>
  <line x1="420" y1="142" x2="398" y2="128" stroke="#e5e0d6" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="454" cy="143" rx="17" ry="4" fill="#e8b86d"/>
  <text class="ts" x="446" y="186" text-anchor="middle">panci</text>

  <!-- gelombang EM merambat ke kanan -->
  <path class="hs" d="M 496,150 q 10,-11 20,0 t 20,0 t 20,0 t 20,0"/>
  <path class="hs" d="M 496,180 q 10,-13 20,0 t 20,0 t 20,0 t 20,0"/>
  <path class="hs" d="M 496,210 q 10,-9 20,0 t 20,0 t 20,0 t 20,0"/>
  <text class="acc" x="536" y="238" text-anchor="middle">gelombang EM</text>

  <text class="ts" x="500" y="252" text-anchor="middle">tanpa media perantara</text>
  <text class="ts" x="500" y="270" text-anchor="middle">menghantarkan kalor</text>
  <text class="ts" x="500" y="288" text-anchor="middle">paling cepat</text>
</svg>
