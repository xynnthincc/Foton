<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"
     aria-label="Lembaran gerak parabola benda yang dilempar dengan kecepatan awal v0">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-para); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-para); }
      .hs  { stroke: #e8b86d; stroke-width: 1.8; marker-end: url(#va-para); }
      .ext { stroke: #7fb069; stroke-width: 1.8; marker-end: url(#vg-para); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <marker id="vb-para" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-para" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="va-para" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
    <marker id="vg-para" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
  </defs>

  <text class="acc" x="30" y="26">Gerak parabola (projectile)</text>
  <text class="ts" x="396" y="26">tanpa hambatan udara</text>

  <!-- tanah -->
  <line x1="30" y1="290" x2="582" y2="290" stroke="#8a857d" stroke-width="1.5"/>

  <!-- lintasan parabola: apex di (325,90) -->
  <path class="ln" d="M 80,290 Q 325,-110 570,290"/>

  <!-- garis horizontal dari puncak sebagai acuan tinggi maksimum -->
  <path class="ax" d="M 100,90 H 318"/>
  <text class="ts" x="110" y="82">tinggi maksimum (h)</text>

  <!-- titik puncak -->
  <circle cx="325" cy="90" r="4.5" fill="#d97757"/>
  <text class="tb" x="332" y="74">puncak</text>

  <!-- kecepatan di puncak: horizontal, vy = 0 -->
  <line class="vd" x1="325" y1="90" x2="420" y2="90"/>
  <text class="t" x="426" y="94">v</text>
  <text class="ts" x="430" y="110">v = vx, vy = 0</text>

  <!-- dimensi tinggi maksimum h -->
  <line class="fa" x1="325" y1="98" x2="325" y2="282"/>
  <text class="acc" x="317" y="190" text-anchor="middle" transform="rotate(-90 317 190)">h</text>

  <!-- titik luncur -->
  <circle cx="80" cy="290" r="4.5" fill="#7fb069"/>
  <text class="ts" x="30" y="248">titik luncur</text>
  <path class="ax" d="M 64,252 L 74,280"/>

  <!-- kecepatan awal v0 (sepanjang garis singgung lintasan) -->
  <line class="ext" x1="80" y1="290" x2="153.1" y2="170.6"/>
  <text class="t" x="158" y="168">v₀</text>

  <!-- komponen kecepatan awal -->
  <line class="vd" stroke-dasharray="5 4" x1="80" y1="290" x2="153.1" y2="290"/>
  <text class="t" x="120" y="286">vx</text>
  <line class="vd" stroke-dasharray="5 4" x1="80" y1="290" x2="80" y2="170.6"/>
  <text class="t" x="88" y="178">vy</text>

  <!-- sudut-launch -->
  <path fill="none" stroke="#8a857d" stroke-width="1.2" d="M 110,290 A 30,30 0 0 0 95.7,264.4"/>
  <text class="t" x="104" y="268">θ</text>

  <!-- kecepatan pada cabang turun: makin lama makin ke bawah -->
  <line class="vd" x1="450" y1="142" x2="519" y2="199.6"/>
  <text class="t" x="525" y="206">v</text>

  <!-- gravitasi tetap tegak lurus tanah -->
  <line class="fa" x1="450" y1="142" x2="450" y2="186"/>
  <text class="acc" x="440" y="200" text-anchor="end">g</text>

  <!-- titik jatuh -->
  <circle cx="570" cy="290" r="4.5" fill="#7fb069"/>
  <text class="ts" x="550" y="280" text-anchor="end">titik jatuh</text>

  <!-- waktu jatuh total -->
  <path class="dim" d="M 80,290 V 318 M 570,290 V 318"/>
  <line class="dim" x1="80" y1="314" x2="570" y2="314"/>
  <polygon points="92,309 80,314 92,319" fill="#8a857d"/>
  <polygon points="558,309 570,314 558,319" fill="#8a857d"/>
  <text class="tb" x="325" y="332" text-anchor="middle">waktu jatuh total (t)</text>

  <!-- keterangan komponen -->
  <text class="ts" x="352" y="246">vx tetap (horizontal)</text>
  <text class="ts" x="352" y="262">vy mengecil karena gravitasi</text>
</svg>