<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"
     aria-label="Mesin Atwood ideal: katrol dengan dua massa m1 dan m2, gaya berat, tegangan tali T, dan percepatan berlawanan arah">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-katrol); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-katrol); }
      .hs  { stroke: #e8b86d; stroke-width: 1.8; marker-end: url(#va-katrol); }
      .ext { stroke: #7fb069; stroke-width: 1.8; marker-end: url(#vg-katrol); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <marker id="vb-katrol" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-katrol" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="va-katrol" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
    <marker id="vg-katrol" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
  </defs>

  <text class="acc" x="20" y="26">Mesin Atwood (katrol ideal)</text>

  <!-- poros katrol -->
  <line class="dim" x1="300" y1="62" x2="300" y2="116"/>
  <text class="ts" x="300" y="130" text-anchor="middle">poros</text>

  <!-- katrol -->
  <circle cx="300" cy="62" r="32" fill="none" stroke="#e5e0d6" stroke-width="2.5"/>
  <circle cx="300" cy="62" r="5" fill="#e5e0d6"/>
  <path class="ax" d="M 346,44 L 330,54"/>
  <text class="tb" x="350" y="48">katrol (ideal, massa diabaikan)</text>

  <!-- tali ideal melewati katrol -->
  <path fill="none" stroke="#e5e0d6" stroke-width="2.5" d="M 268,170 V 62 A 32,32 0 0 1 332,62 V 170"/>
  <path class="ax" d="M 200,92 L 266,92"/>
  <text class="ts" x="192" y="96" text-anchor="end">tali</text>

  <!-- ============ massa m1 (kiri, turun) ============ -->
  <rect x="246" y="170" width="44" height="44" fill="#3a3835" stroke="#7fb069" stroke-width="1.8"/>
  <text class="tb" x="268" y="198" text-anchor="middle">m₁</text>

  <line class="ext" x1="256" y1="170" x2="256" y2="124"/>
  <text class="tb" x="248" y="118" text-anchor="end">T</text>

  <line class="fa" x1="256" y1="214" x2="256" y2="272"/>
  <text class="tb" x="264" y="278">m₁g</text>

  <line class="vd" x1="230" y1="192" x2="230" y2="262"/>
  <text class="acc" x="222" y="268" text-anchor="end">a₁ (turun)</text>

  <!-- ============ massa m2 (kanan, naik) ============ -->
  <rect x="310" y="170" width="44" height="44" fill="#3a3835" stroke="#7fb069" stroke-width="1.8"/>
  <text class="tb" x="332" y="198" text-anchor="middle">m₂</text>

  <line class="ext" x1="344" y1="170" x2="344" y2="124"/>
  <text class="tb" x="352" y="118">T</text>

  <line class="fa" x1="344" y1="214" x2="344" y2="272"/>
  <text class="tb" x="352" y="278">m₂g</text>

  <line class="vd" x1="370" y1="192" x2="370" y2="142"/>
  <text class="acc" x="378" y="138">a₂ (naik)</text>

  <!-- keterangan -->
  <text class="ts" x="460" y="130">Keterangan:</text>
  <text class="ts" x="460" y="150">hijau = tegangan tali T</text>
  <text class="ts" x="460" y="168">jingga = berat mg</text>
  <text class="ts" x="460" y="186">biru = percepatan a</text>

  <text class="ts" x="20" y="306">T sama pada kedua sisi tali (katrol ideal)</text>
  <text class="ts" x="20" y="324">m₁ &gt; m₂ → m₁ turun, m₂ naik (a berlawanan arah)</text>

  <rect x="392" y="294" width="3" height="16" fill="#e8b86d"/>
  <text class="tb" x="400" y="306">a = (m₁ − m₂) g / (m₁ + m₂)</text>
  <text class="ts" x="400" y="324">besar a kedua massa sama</text>
</svg>