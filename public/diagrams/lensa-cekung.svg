<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Lensa cekung dengan sinar istimewa">
  <defs>
    <style>
      .txt { font-family: system-ui, sans-serif; font-size: 13px; fill: #e5e0d6; }
      .txtb { font-family: system-ui, sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .axis { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 6 4; }
      .ray { stroke: #6ba3c0; stroke-width: 1.6; marker-end: url(#a); }
      .ref { stroke: #d97757; stroke-width: 1.6; marker-end: url(#b); }
      .dash { stroke: #d97757; stroke-width: 1.4; stroke-dasharray: 4 3; }
      .lens { fill: none; stroke: #7fb069; stroke-width: 2.5; }
      .pt { fill: #d97757; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6ba3c0" /></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d97757" /></marker>
  </defs>

  <line class="axis" x1="20" y1="160" x2="580" y2="160" />

  <path class="lens" d="M 300,70 Q 285,160 300,250" />
  <path class="lens" d="M 300,70 Q 315,160 300,250" />
  <text class="txt" x="285" y="60">lensa</text>

  <circle class="pt" cx="370" cy="160" r="4" />
  <text class="txtb" x="360" y="185">F (maya)</text>
  <circle class="pt" cx="230" cy="160" r="4" />
  <text class="txtb" x="220" y="185">F (maya)</text>

  <line stroke="#7fb069" stroke-width="2" x1="100" y1="160" x2="100" y2="95" />
  <polygon points="94,101 100,89 106,101" fill="#7fb069" />
  <text class="txt" x="85" y="85">benda</text>

  <line class="ray" x1="100" y1="95" x2="300" y2="95" />
  <line class="dash" x1="300" y1="95" x2="370" y2="160" />
  <line class="ref" x1="300" y1="95" x2="70" y2="90" />

  <line class="ray" x1="100" y1="95" x2="300" y2="160" />
  <line class="ref" x1="300" y1="160" x2="530" y2="160" />

  <text class="txt" x="40" y="300">Bayangan maya, tegak, diminutive, di sisi sumber (antara lensa dan benda).</text>
</svg