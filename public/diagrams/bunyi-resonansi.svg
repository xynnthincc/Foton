<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"
     aria-label="Resonansi tabung udara: tabung tertutup satu ujung dan tabung terbuka dua ujung dengan tiga harmoni">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-br); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-br); }
      .hs  { stroke: #e8b86d; stroke-width: 1.8; marker-end: url(#va-br); }
      .ext { stroke: #7fb069; stroke-width: 1.8; marker-end: url(#vg-br); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .sb  { font-size: 11px; }
    </style>
    <marker id="vb-br" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-br" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="va-br" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
    <marker id="vg-br" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
    <marker id="vd2-br" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8a857d"/>
    </marker>
  </defs>

  <line class="ax" x1="300" y1="24" x2="300" y2="312"/>

  <!-- ================= TABUNG TERTUTUP SATU UJUNG ================= -->
  <text class="tb" x="166" y="40" text-anchor="middle">Tabung tertutup satu ujung</text>

  <!-- panjang tabung -->
  <line x1="38" y1="100" x2="38" y2="240" stroke="#8a857d" stroke-width="1"
        marker-end="url(#vd2-br)" marker-start="url(#vd2-br)"/>
  <text class="tb" x="32" y="174" text-anchor="end">L</text>

  <!-- dinding tabung (tertutup di bawah) -->
  <path class="ln" d="M 55,100 L 55,240 L 117,240 L 117,100"/>
  <path class="ln" d="M 135,100 L 135,240 L 197,240 L 197,100"/>
  <path class="ln" d="M 215,100 L 215,240 L 277,240 L 277,100"/>
  <text class="ts" x="86" y="258" text-anchor="middle">tertutup</text>

  <!-- harmoni 1 : L = lambda/4 -->
  <path d="M 86,240 L 89.5,222.5 L 92.9,205 L 96,187.5 L 98.7,170 L 101,152.5 L 102.6,135 L 103.7,117.5 L 104,100"
        fill="none" stroke="#6ba3c0" stroke-width="2"/>
  <!-- harmoni 3 : L = 3 lambda/4 -->
  <path d="M 166,240 L 174.2,226 L 180.6,212 L 183.8,198 L 184,193.3 L 183.1,184 L 178.7,170
           L 171.6,156 L 166,146.7 L 163.2,142 L 155.4,128 L 150,114 L 148,100"
        fill="none" stroke="#6ba3c0" stroke-width="2"/>
  <!-- harmoni 5 : L = 5 lambda/4 -->
  <path d="M 246,240 L 258.7,226 L 264,212 L 258.7,198 L 246,184 L 233.3,170 L 228,156
           L 233.3,142 L 246,128 L 258.7,114 L 264,100"
        fill="none" stroke="#6ba3c0" stroke-width="2"/>

  <!-- bunyi keluar dari ujung terbuka -->
  <line class="hs" x1="86" y1="96" x2="86" y2="74"/>
  <line class="hs" x1="166" y1="96" x2="166" y2="74"/>
  <line class="hs" x1="246" y1="96" x2="246" y2="74"/>
  <text class="ts" x="166" y="68" text-anchor="middle">bunyi keluar</text>

  <text class="t" x="86" y="282" text-anchor="middle">n = 1</text>
  <text class="ts" x="86" y="300" text-anchor="middle">L = &#955;/4</text>
  <text class="t" x="166" y="282" text-anchor="middle">n = 3</text>
  <text class="ts" x="166" y="300" text-anchor="middle">L = 3&#955;/4</text>
  <text class="t" x="246" y="282" text-anchor="middle">n = 5</text>
  <text class="ts" x="246" y="300" text-anchor="middle">L = 5&#955;/4</text>

  <!-- ================= TABUNG TERBUKA DUA UJUNG ================= -->
  <text class="tb" x="436" y="40" text-anchor="middle">Tabung terbuka dua ujung</text>

  <!-- dinding tabung (terbuka di atas dan bawah) -->
  <line class="ln" x1="325" y1="100" x2="325" y2="240"/>
  <line class="ln" x1="387" y1="100" x2="387" y2="240"/>
  <line class="ln" x1="405" y1="100" x2="405" y2="240"/>
  <line class="ln" x1="467" y1="100" x2="467" y2="240"/>
  <line class="ln" x1="485" y1="100" x2="485" y2="240"/>
  <line class="ln" x1="547" y1="100" x2="547" y2="240"/>
  <text class="ts" x="582" y="96" text-anchor="end">terbuka</text>

  <!-- harmoni 1 : L = lambda/2 -->
  <path d="M 356,240 L 362.9,222.5 L 368.7,205 L 372.6,187.5 L 374,170 L 372.6,152.5 L 368.7,135 L 362.9,117.5 L 356,100"
        fill="none" stroke="#7fb069" stroke-width="2"/>
  <!-- harmoni 2 : L = lambda -->
  <path d="M 436,240 L 448.7,222.5 L 454,205 L 448.7,187.5 L 436,170 L 423.3,152.5 L 418,135 L 423.3,117.5 L 436,100"
        fill="none" stroke="#7fb069" stroke-width="2"/>
  <!-- harmoni 3 : L = 3 lambda/2 -->
  <path d="M 516,240 L 528.7,228.3 L 534,216.7 L 528.7,205 L 516,193.3 L 503.3,181.7 L 498,170
           L 503.3,158.3 L 516,146.7 L 528.7,135 L 534,123.3 L 528.7,111.7 L 516,100"
        fill="none" stroke="#7fb069" stroke-width="2"/>

  <!-- bunyi keluar dari kedua ujung -->
  <line class="hs" x1="356" y1="96" x2="356" y2="74"/>
  <line class="hs" x1="436" y1="96" x2="436" y2="74"/>
  <line class="hs" x1="516" y1="96" x2="516" y2="74"/>
  <line class="hs" x1="356" y1="244" x2="356" y2="266"/>
  <line class="hs" x1="436" y1="244" x2="436" y2="266"/>
  <line class="hs" x1="516" y1="244" x2="516" y2="266"/>
  <text class="ts" x="436" y="68" text-anchor="middle">bunyi keluar</text>

  <text class="t" x="356" y="282" text-anchor="middle">n = 1</text>
  <text class="ts" x="356" y="300" text-anchor="middle">L = &#955;/2</text>
  <text class="t" x="436" y="282" text-anchor="middle">n = 2</text>
  <text class="ts" x="436" y="300" text-anchor="middle">L = &#955;</text>
  <text class="t" x="516" y="282" text-anchor="middle">n = 3</text>
  <text class="ts" x="516" y="300" text-anchor="middle">L = 3&#955;/2</text>

  <!-- node dan antinode -->
  <g fill="#8a857d">
    <circle cx="86" cy="240" r="3.5"/>
    <circle cx="166" cy="240" r="3.5"/>
    <circle cx="166" cy="146.7" r="3.5"/>
    <circle cx="246" cy="240" r="3.5"/>
    <circle cx="246" cy="184" r="3.5"/>
    <circle cx="246" cy="128" r="3.5"/>
    <circle cx="356" cy="240" r="3.5"/>
    <circle cx="356" cy="100" r="3.5"/>
    <circle cx="436" cy="240" r="3.5"/>
    <circle cx="436" cy="170" r="3.5"/>
    <circle cx="436" cy="100" r="3.5"/>
    <circle cx="516" cy="240" r="3.5"/>
    <circle cx="516" cy="193.3" r="3.5"/>
    <circle cx="516" cy="146.7" r="3.5"/>
    <circle cx="516" cy="100" r="3.5"/>
  </g>
  <g fill="none" stroke="#d97757" stroke-width="2">
    <circle cx="86" cy="100" r="4.5"/>
    <circle cx="166" cy="193.3" r="4.5"/>
    <circle cx="166" cy="100" r="4.5"/>
    <circle cx="246" cy="212" r="4.5"/>
    <circle cx="246" cy="156" r="4.5"/>
    <circle cx="246" cy="100" r="4.5"/>
    <circle cx="356" cy="170" r="4.5"/>
    <circle cx="436" cy="205" r="4.5"/>
    <circle cx="436" cy="135" r="4.5"/>
    <circle cx="516" cy="216.7" r="4.5"/>
    <circle cx="516" cy="170" r="4.5"/>
    <circle cx="516" cy="123.3" r="4.5"/>
  </g>

  <!-- legenda -->
  <circle cx="150" cy="322" r="3.5" fill="#8a857d"/>
  <text class="ts" x="160" y="326">N = node (simpangan 0)</text>
  <circle cx="320" cy="322" r="4.5" fill="none" stroke="#d97757" stroke-width="2"/>
  <text class="ts" x="334" y="326">A = antinode (simpangan maksimum)</text>
</svg>