<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"
     aria-label="Aliran fluida dalam pipa menyempit: kecepatan meningkat, tekanan menurun, dan persamaan kontinuitas">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-fp); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-fp); }
      .hs  { stroke: #e8b86d; stroke-width: 1.8; marker-end: url(#va-fp); }
      .ext { stroke: #7fb069; stroke-width: 1.8; marker-end: url(#vg-fp); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .sb  { font-size: 11px; }
    </style>
    <marker id="vb-fp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-fp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="va-fp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
    <marker id="vg-fp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
    <marker id="vd2-fp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8a857d"/>
    </marker>
  </defs>

  <!-- sumbu aliran -->
  <line class="ax" x1="20" y1="160" x2="580" y2="160"/>

  <!-- pipa: satu path tertutup (lebar - sempit - lebar) -->
  <path d="M 40,90 L 190,90 L 260,120 L 340,120 L 410,90 L 560,90 L 560,230 L 410,230
           L 340,180 L 260,180 L 190,230 L 40,230 Z"
        fill="#2a2926" stroke="#e5e0d6" stroke-width="2"/>

  <!-- kecepatan di bagian lebar (kecil) -->
  <line class="vd" x1="60" y1="205" x2="155" y2="205"/>
  <text class="t" x="107" y="196" text-anchor="middle" style="fill:#6ba3c0">v<tspan dy="4" class="sb">1</tspan></text>

  <!-- tekanan di bagian lebar (tinggi) -->
  <text class="tb" x="105" y="130">p<tspan dy="4" class="sb">1</tspan><tspan dy="-4"> (tinggi)</tspan></text>

  <!-- kecepatan di bagian sempit (besar, panah lebih panjang) -->
  <line class="vd" x1="250" y1="160" x2="400" y2="160"/>
  <text class="t" x="325" y="151" text-anchor="middle" style="fill:#6ba3c0">v<tspan dy="4" class="sb">2</tspan></text>

  <!-- tekanan di bagian sempit (rendah) -->
  <text class="tb" x="300" y="176" text-anchor="middle">p<tspan dy="4" class="sb">2</tspan><tspan dy="-4"> (rendah)</tspan></text>

  <!-- bagian lebar kanan -->
  <line class="vd" x1="430" y1="205" x2="525" y2="205"/>
  <text class="t" x="477" y="196" text-anchor="middle" style="fill:#6ba3c0">v<tspan dy="4" class="sb">1</tspan></text>
  <text class="tb" x="500" y="130">p<tspan dy="4" class="sb">1</tspan><tspan dy="-4"> (tinggi)</tspan></text>

  <!-- garis dimensi luas penampang -->
  <line class="dim" x1="175" y1="90" x2="175" y2="230"
        marker-end="url(#vd2-fp)" marker-start="url(#vd2-fp)"/>
  <text class="t" x="175" y="252" text-anchor="middle">A<tspan dy="4" class="sb">1</tspan></text>

  <line class="dim" x1="300" y1="120" x2="300" y2="152" marker-end="url(#vd2-fp)"/>
  <line class="dim" x1="300" y1="168" x2="300" y2="180" marker-end="url(#vd2-fp)"/>
  <text class="t" x="300" y="252" text-anchor="middle">A<tspan dy="4" class="sb">2</tspan></text>

  <text class="ts" x="470" y="252" text-anchor="middle">A<tspan dy="4" class="sb">1</tspan><tspan dy="-4"> &gt; A</tspan><tspan dy="4" class="sb">2</tspan></text>

  <!-- persamaan -->
  <line class="ax" x1="40" y1="268" x2="560" y2="268"/>
  <text class="acc" x="200" y="294" text-anchor="middle" style="font-size:15px">A<tspan dy="4" class="sb">1</tspan><tspan dy="-4"> v</tspan><tspan dy="4" class="sb">1</tspan><tspan dy="-4"> = A</tspan><tspan dy="4" class="sb">2</tspan><tspan dy="-4"> v</tspan><tspan dy="4" class="sb">2</tspan></text>
  <text class="ts" x="200" y="314" text-anchor="middle">kontinuitas (kekekalan massa)</text>
  <text class="acc" x="420" y="294" text-anchor="middle" style="font-size:15px">p<tspan dy="4" class="sb">1</tspan><tspan dy="-4"> &gt; p</tspan><tspan dy="4" class="sb">2</tspan></text>
  <text class="ts" x="420" y="314" text-anchor="middle">hukum Bernoulli</text>
  <text class="ts" x="200" y="334" text-anchor="middle">v<tspan dy="4" class="sb">2</tspan><tspan dy="-4"> &gt; v</tspan><tspan dy="4" class="sb">1</tspan><tspan dy="-4"> karena A</tspan><tspan dy="4" class="sb">2</tspan><tspan dy="-4"> &lt; A</tspan><tspan dy="4" class="sb">1</tspan></text>
</svg>