<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"
     aria-label="Tiga alat ukur panjang: mistar, jangka sorong dengan skala nonius, dan mikrometer sekrup">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-pengukuran); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-pengukuran); }
      .hs  { stroke: #e8b86d; stroke-width: 1.8; marker-end: url(#va-pengukuran); }
      .ext { stroke: #7fb069; stroke-width: 1.8; marker-end: url(#vg-pengukuran); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <marker id="vb-pengukuran" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-pengukuran" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="va-pengukuran" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
    <marker id="vg-pengukuran" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
  </defs>

  <!-- ================= MISTAR ================= -->
  <text class="acc" x="14" y="20">Mistar</text>
  <text class="ts" x="380" y="20">pembacaan terkecil 1 mm</text>

  <!-- benda yang diukur, ujung kiri tepat di angka 0 -->
  <rect x="66" y="26" width="300" height="16" fill="#3a3835" stroke="#e5e0d6" stroke-width="1.5"/>
  <text class="t" x="72" y="39">benda</text>

  <!-- batang mistar -->
  <rect x="62" y="48" width="496" height="42" fill="none" stroke="#e5e0d6" stroke-width="1.5"/>

  <!-- garis bagi: mm (tipis), 5 mm, dan 1 cm -->
  <path fill="none" stroke="#8a857d" stroke-width="0.8" d="M 68.4,48 v5 M 70.8,48 v5 M 73.2,48 v5 M 75.6,48 v5 M 80.4,48 v5 M 82.8,48 v5 M 85.2,48 v5 M 87.6,48 v5 M 92.4,48 v5 M 94.8,48 v5 M 97.2,48 v5 M 99.6,48 v5 M 104.4,48 v5 M 106.8,48 v5 M 109.2,48 v5 M 111.6,48 v5 M 116.4,48 v5 M 118.8,48 v5 M 121.2,48 v5 M 123.6,48 v5 M 128.4,48 v5 M 130.8,48 v5 M 133.2,48 v5 M 135.6,48 v5 M 140.4,48 v5 M 142.8,48 v5 M 145.2,48 v5 M 147.6,48 v5 M 152.4,48 v5 M 154.8,48 v5 M 157.2,48 v5 M 159.6,48 v5 M 164.4,48 v5 M 166.8,48 v5 M 169.2,48 v5 M 171.6,48 v5 M 176.4,48 v5 M 178.8,48 v5 M 181.2,48 v5 M 183.6,48 v5 M 188.4,48 v5 M 190.8,48 v5 M 193.2,48 v5 M 195.6,48 v5 M 200.4,48 v5 M 202.8,48 v5 M 205.2,48 v5 M 207.6,48 v5 M 212.4,48 v5 M 214.8,48 v5 M 217.2,48 v5 M 219.6,48 v5 M 224.4,48 v5 M 226.8,48 v5 M 229.2,48 v5 M 231.6,48 v5 M 236.4,48 v5 M 238.8,48 v5 M 241.2,48 v5 M 243.6,48 v5 M 248.4,48 v5 M 250.8,48 v5 M 253.2,48 v5 M 255.6,48 v5 M 260.4,48 v5 M 262.8,48 v5 M 265.2,48 v5 M 267.6,48 v5 M 272.4,48 v5 M 274.8,48 v5 M 277.2,48 v5 M 279.6,48 v5 M 284.4,48 v5 M 286.8,48 v5 M 289.2,48 v5 M 291.6,48 v5 M 296.4,48 v5 M 298.8,48 v5 M 301.2,48 v5 M 303.6,48 v5 M 308.4,48 v5 M 310.8,48 v5 M 313.2,48 v5 M 315.6,48 v5 M 320.4,48 v5 M 322.8,48 v5 M 325.2,48 v5 M 327.6,48 v5 M 332.4,48 v5 M 334.8,48 v5 M 337.2,48 v5 M 339.6,48 v5 M 344.4,48 v5 M 346.8,48 v5 M 349.2,48 v5 M 351.6,48 v5 M 356.4,48 v5 M 358.8,48 v5 M 361.2,48 v5 M 363.6,48 v5 M 368.4,48 v5 M 370.8,48 v5 M 373.2,48 v5 M 375.6,48 v5 M 380.4,48 v5 M 382.8,48 v5 M 385.2,48 v5 M 387.6,48 v5 M 392.4,48 v5 M 394.8,48 v5 M 397.2,48 v5 M 399.6,48 v5 M 404.4,48 v5 M 406.8,48 v5 M 409.2,48 v5 M 411.6,48 v5 M 416.4,48 v5 M 418.8,48 v5 M 421.2,48 v5 M 423.6,48 v5 M 428.4,48 v5 M 430.8,48 v5 M 433.2,48 v5 M 435.6,48 v5 M 440.4,48 v5 M 442.8,48 v5 M 445.2,48 v5 M 447.6,48 v5 M 452.4,48 v5 M 454.8,48 v5 M 457.2,48 v5 M 459.6,48 v5 M 464.4,48 v5 M 466.8,48 v5 M 469.2,48 v5 M 471.6,48 v5 M 476.4,48 v5 M 478.8,48 v5 M 481.2,48 v5 M 483.6,48 v5 M 488.4,48 v5 M 490.8,48 v5 M 493.2,48 v5 M 495.6,48 v5 M 500.4,48 v5 M 502.8,48 v5 M 505.2,48 v5 M 507.6,48 v5 M 512.4,48 v5 M 514.8,48 v5 M 517.2,48 v5 M 519.6,48 v5 M 524.4,48 v5 M 526.8,48 v5 M 529.2,48 v5 M 531.6,48 v5 M 536.4,48 v5 M 538.8,48 v5 M 541.2,48 v5 M 543.6,48 v5"/>
  <path fill="none" stroke="#8a857d" stroke-width="1" d="M 78,48 v11 M 102,48 v11 M 126,48 v11 M 150,48 v11 M 174,48 v11 M 198,48 v11 M 222,48 v11 M 246,48 v11 M 270,48 v11 M 294,48 v11 M 318,48 v11 M 342,48 v11 M 366,48 v11 M 390,48 v11 M 414,48 v11 M 438,48 v11 M 462,48 v11 M 486,48 v11 M 510,48 v11 M 534,48 v11"/>
  <path fill="none" stroke="#e5e0d6" stroke-width="1.4" d="M 66,48 v18 M 90,48 v18 M 114,48 v18 M 138,48 v18 M 162,48 v18 M 186,48 v18 M 210,48 v18 M 234,48 v18 M 258,48 v18 M 282,48 v18 M 306,48 v18 M 330,48 v18 M 354,48 v18 M 378,48 v18 M 402,48 v18 M 426,48 v18 M 450,48 v18 M 474,48 v18 M 498,48 v18 M 522,48 v18 M 546,48 v18"/>

  <!-- angka skala sentimeter -->
  <g class="ts" text-anchor="middle">
    <text x="66" y="84">0</text><text x="90" y="84">1</text><text x="114" y="84">2</text>
    <text x="138" y="84">3</text><text x="162" y="84">4</text><text x="186" y="84">5</text>
    <text x="210" y="84">6</text><text x="234" y="84">7</text><text x="258" y="84">8</text>
    <text x="282" y="84">9</text><text x="306" y="84">10</text><text x="330" y="84">11</text>
    <text x="354" y="84">12</text><text x="378" y="84">13</text><text x="402" y="84">14</text>
    <text x="426" y="84">15</text><text x="450" y="84">16</text><text x="474" y="84">17</text>
    <text x="498" y="84">18</text><text x="522" y="84">19</text><text x="546" y="84">20</text>
  </g>

  <!-- tanda panah dimensi: dari angka 0 sampai ujung benda -->
  <path class="dim" d="M 66,90 V 110 M 366,90 V 110"/>
  <line class="dim" x1="66" y1="104" x2="366" y2="104"/>
  <polygon points="76,99 66,104 76,109" fill="#8a857d"/>
  <polygon points="356,99 366,104 356,109" fill="#8a857d"/>
  <text class="tb" x="216" y="122" text-anchor="middle">12,5 cm</text>

  <!-- ================= JANGKA SORONG ================= -->
  <text class="acc" x="14" y="138">Jangka sorong</text>
  <text class="tb" x="288" y="138" text-anchor="end">SU</text>

  <!-- batang skala utama -->
  <line class="ln" x1="26" y1="166" x2="274" y2="166"/>
  <path fill="none" stroke="#e5e0d6" stroke-width="1.2" d="M 30,166 v14 M 70,166 v14 M 110,166 v14 M 150,166 v14 M 190,166 v14 M 230,166 v14 M 270,166 v14"/>
  <path fill="none" stroke="#8a857d" stroke-width="1" d="M 38,166 v8 M 46,166 v8 M 54,166 v8 M 62,166 v8 M 78,166 v8 M 86,166 v8 M 94,166 v8 M 102,166 v8 M 118,166 v8 M 126,166 v8 M 134,166 v8 M 142,166 v8 M 158,166 v8 M 166,166 v8 M 174,166 v8 M 182,166 v8 M 198,166 v8 M 206,166 v8 M 214,166 v8 M 222,166 v8 M 238,166 v8 M 246,166 v8 M 254,166 v8 M 262,166 v8"/>

  <g class="ts" text-anchor="middle">
    <text x="30" y="158">0</text><text x="70" y="158">5</text><text x="110" y="158">10</text>
    <text x="150" y="158">15</text><text x="190" y="158">20</text><text x="230" y="158">25</text>
    <text x="270" y="158">30</text>
  </g>

  <!-- bilah nonius (SN) yang dapat digeser -->
  <rect x="158" y="188" width="80" height="24" fill="#3a3835" stroke="#e5e0d6" stroke-width="1.5"/>
  <path fill="none" stroke="#e5e0d6" stroke-width="1.2" d="M 161.2,212 v-12 M 197.2,212 v-12 M 233.2,212 v-12"/>
  <path fill="none" stroke="#8a857d" stroke-width="1" d="M 168.4,212 v-8 M 175.6,212 v-8 M 182.8,212 v-8 M 190,212 v-8 M 204.4,212 v-8 M 211.6,212 v-8 M 218.8,212 v-8 M 226,212 v-8"/>
  <g class="ts" text-anchor="middle">
    <text x="161.2" y="226">0</text><text x="197.2" y="226">5</text><text x="233.2" y="226">10</text>
  </g>
  <text class="tb" x="246" y="202">SN</text>

  <!-- garis nonius yang tepat segaris dengan garis SU, digariskan -->
  <line x1="190" y1="164" x2="190" y2="218" stroke="#d97757" stroke-width="2"/>
  <path class="ax" d="M 192,236 L 190,222"/>
  <text class="acc" x="196" y="242">garis segaris</text>

  <text class="acc" x="14" y="270">Bacaan = 1,64 cm</text>
  <text class="ts" x="14" y="290">SU: 1,6 cm (16 mm)</text>
  <text class="ts" x="14" y="306">SN: divisi ke-4 → 4 × 0,1 mm = 0,4 mm</text>
  <text class="ts" x="14" y="324">1 divisi SN = 0,1 mm (10 divisi SN = 9 mm)</text>

  <!-- ================= MIKROMETER SEKRUP ================= -->
  <text class="acc" x="310" y="142">Mikrometer sekrup</text>

  <!-- batang = skala tetap (skala mm) -->
  <rect x="316" y="158" width="65" height="32" fill="none" stroke="#e5e0d6" stroke-width="1.5"/>
  <path fill="none" stroke="#e5e0d6" stroke-width="1.2" d="M 326,172 v6 M 336,172 v6 M 346,172 v6 M 356,172 v6 M 366,172 v6 M 376,172 v6"/>
  <path fill="none" stroke="#8a857d" stroke-width="1" d="M 331,172 v12 M 341,172 v12 M 351,172 v12 M 361,172 v12 M 371,172 v12"/>
  <g class="ts" text-anchor="middle">
    <text x="326" y="206">0</text><text x="376" y="206">5</text>
  </g>

  <!-- thimble = skala putar -->
  <rect x="381" y="150" width="78" height="48" fill="none" stroke="#e5e0d6" stroke-width="1.5"/>
  <path fill="none" stroke="#e5e0d6" stroke-width="1.2" d="M 381,152 v28 M 398.5,152 v28 M 416,152 v28 M 433.5,152 v28 M 451,152 v28"/>
  <path fill="none" stroke="#8a857d" stroke-width="1" d="M 384.5,152 v20 M 388,152 v20 M 391.5,152 v20 M 395,152 v20 M 402,152 v20 M 405.5,152 v20 M 409,152 v20 M 412.5,152 v20 M 419.5,152 v20 M 423,152 v20 M 426.5,152 v20 M 430,152 v20 M 437,152 v20 M 440.5,152 v20 M 444,152 v20 M 447.5,152 v20 M 454.5,152 v20 M 458,152 v20"/>
  <g class="ts" text-anchor="middle">
    <text x="381" y="212">30</text><text x="398.5" y="212">35</text><text x="416" y="212">40</text>
    <text x="433.5" y="212">45</text><text x="451" y="212">50</text>
  </g>

  <!-- garis acuan batang, diperpanjang sampai menunjuk angka thimble -->
  <line class="dim" x1="316" y1="172" x2="419" y2="172"/>
  <line class="fa" x1="381" y1="172" x2="470" y2="172"/>
  <circle cx="416" cy="172" r="3.5" fill="#d97757"/>
  <text class="ts" x="476" y="168">garis acuan</text>
  <text class="acc" x="464" y="200">40 → 0,40 mm</text>

  <path class="ax" d="M 352,226 V 191"/>
  <text class="ts" x="312" y="222">skala tetap (batang)</text>
  <path class="ax" d="M 442,226 V 199"/>
  <text class="ts" x="446" y="222">skala putar (thimble)</text>

  <text class="acc" x="312" y="266">Bacaan = 5,5 mm + 0,40 mm = 5,90 mm</text>
  <text class="ts" x="312" y="290">skala tetap: 1 divisi = 0,5 mm</text>
  <text class="ts" x="312" y="308">skala putar: tiap angka = 0,05 mm</text>
  <text class="ts" x="312" y="326">dibaca tepat pada garis acuan batang</text>
</svg>