<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"
     aria-label="Tekanan hidrostatik pada bejana dan prinsip Pascal pada dongkar hidrolik">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-fb); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-fb); }
      .hs  { stroke: #e8b86d; stroke-width: 1.8; marker-end: url(#va-fb); }
      .ext { stroke: #7fb069; stroke-width: 1.8; marker-end: url(#vg-fb); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .sb  { font-size: 11px; }
    </style>
    <marker id="vb-fb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-fb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="va-fb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
    <marker id="vg-fb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
    <marker id="vd2-fb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8a857d"/>
    </marker>
  </defs>

  <line class="ax" x1="300" y1="34" x2="300" y2="312"/>

  <!-- ================= PANEL KIRI: TEKANAN HIDROSTATIK ================= -->
  <text class="tb" x="155" y="52" text-anchor="middle">Tekanan hidrostatik</text>

  <!-- bejana -->
  <path class="ln" d="M 60,88 L 60,232 L 250,232 L 250,88"/>
  <rect x="62" y="112" width="186" height="118" fill="#6ba3c0" opacity="0.28"/>
  <line x1="62" y1="112" x2="248" y2="112" stroke="#6ba3c0" stroke-width="2.5"/>
  <line x1="52" y1="232" x2="258" y2="232" stroke="#e5e0d6" stroke-width="4"/>

  <!-- kedalaman h -->
  <line x1="84" y1="112" x2="84" y2="188" stroke="#8a857d" stroke-width="1"
        marker-end="url(#vd2-fb)" marker-start="url(#vd2-fb)"/>
  <text class="tb" x="78" y="154" text-anchor="end">h</text>

  <!-- tekanan pada kedalaman h (menekan ke bawah) -->
  <line class="vd" x1="140" y1="120" x2="140" y2="188"/>
  <text class="t" x="147" y="158" style="fill:#6ba3c0">p</text>

  <!-- gaya pada dasar (menekan ke atas) -->
  <line class="fa" x1="190" y1="230" x2="190" y2="192"/>
  <text class="t" x="197" y="216" style="fill:#d97757">F</text>

  <text class="acc" x="155" y="274" text-anchor="middle" style="font-size:15px">p = &#961; g h</text>
  <text class="acc" x="155" y="298" text-anchor="middle" style="font-size:15px">F = p &#183; A</text>

  <!-- ================= PANEL KANAN: PRINSIP PASCAL ================= -->
  <text class="tb" x="445" y="52" text-anchor="middle">Prinsip Pascal (dongkar hidrolik)</text>

  <!-- silinder kecil + tabung penghubung -->
  <rect x="423" y="100" width="34" height="40" fill="#6ba3c0" opacity="0.28" stroke="#e5e0d6" stroke-width="2"/>
  <rect x="433" y="140" width="14" height="56" fill="#6ba3c0" opacity="0.28" stroke="#e5e0d6" stroke-width="2"/>

  <!-- silinder besar + fluida -->
  <rect x="345" y="196" width="190" height="72" fill="none" stroke="#e5e0d6" stroke-width="2"/>
  <rect x="347" y="238" width="186" height="28" fill="#6ba3c0" opacity="0.28"/>

  <!-- piston kecil -->
  <rect x="417" y="88" width="46" height="12" rx="2" fill="#2a2926" stroke="#e5e0d6" stroke-width="2"/>
  <line class="fa" x1="440" y1="62" x2="440" y2="86"/>
  <text class="t" x="448" y="78" style="fill:#d97757">F<tspan dy="4" class="sb">1</tspan></text>

  <!-- dua piston besar -->
  <rect x="355" y="210" width="70" height="28" fill="#2a2926" stroke="#e5e0d6" stroke-width="2"/>
  <rect x="455" y="210" width="70" height="28" fill="#2a2926" stroke="#e5e0d6" stroke-width="2"/>

  <!-- gaya pada kedua permukaan sama panjang = tekanan sama -->
  <line class="vd" x1="390" y1="264" x2="390" y2="241"/>
  <text class="t" x="383" y="257" text-anchor="end" style="fill:#6ba3c0">p</text>
  <line class="vd" x1="490" y1="264" x2="490" y2="241"/>
  <text class="t" x="497" y="257" style="fill:#6ba3c0">p</text>

  <!-- gayaoutput F2 ke atas -->
  <line class="fa" x1="390" y1="206" x2="390" y2="176"/>
  <text class="t" x="390" y="170" text-anchor="middle" style="fill:#d97757">F<tspan dy="4" class="sb">2</tspan></text>
  <line class="fa" x1="490" y1="206" x2="490" y2="176"/>
  <text class="t" x="490" y="170" text-anchor="middle" style="fill:#d97757">F<tspan dy="4" class="sb">2</tspan></text>

  <!-- dimensi luas piston -->
  <line x1="470" y1="102" x2="470" y2="138" stroke="#8a857d" stroke-width="1"
        marker-end="url(#vd2-fb)" marker-start="url(#vd2-fb)"/>
  <text class="ts" x="477" y="124">A<tspan dy="4" class="sb">1</tspan></text>
  <line x1="336" y1="210" x2="336" y2="238" stroke="#8a857d" stroke-width="1"
        marker-end="url(#vd2-fb)" marker-start="url(#vd2-fb)"/>
  <text class="ts" x="329" y="228" text-anchor="end">A<tspan dy="4" class="sb">2</tspan></text>

  <!-- persamaan -->
  <text class="acc" x="445" y="292" text-anchor="middle" style="font-size:15px">F<tspan dy="4" class="sb">1</tspan><tspan dy="-4"> / A</tspan><tspan dy="4" class="sb">1</tspan><tspan dy="-4"> = F</tspan><tspan dy="4" class="sb">2</tspan><tspan dy="-4"> / A</tspan><tspan dy="4" class="sb">2</tspan></text>
  <text class="ts" x="445" y="310" text-anchor="middle">F<tspan dy="4" class="sb">2</tspan><tspan dy="-4"> &gt; F</tspan><tspan dy="4" class="sb">1</tspan><tspan dy="-4"> karena A</tspan><tspan dy="4" class="sb">2</tspan><tspan dy="-4"> &gt; A</tspan><tspan dy="4" class="sb">1</tspan></text>
  <text class="ts" x="445" y="328" text-anchor="middle">tekanan p sama pada kedua permukaan</text>
</svg>