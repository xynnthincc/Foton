<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"
     aria-label="Tiga sinar istimewa pada cermin cekung: sejajar sumbu, lewat fokus, dan lewat pusat kelengkungan">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-si); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-si); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <marker id="vb-si" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-si" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="vg-si" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
    <marker id="va-si" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
  </defs>

  <!-- judul dan catatan -->
  <text class="tb" x="30" y="26">Tiga sinar istimewa pada cermin cekung</text>
  <text class="ts" x="30" y="44">benda di luar C (s &gt; 2f) &#8594; bayangan nyata</text>
  <text class="ts" x="30" y="60">I&#8242; = bayangan; ketiga sinar bertemu di satu titik</text>

  <!-- catatan pojok kanan -->
  <text class="ts" x="575" y="26" text-anchor="end">F = titik fokus, berjarak f dari cermin</text>
  <text class="ts" x="575" y="42" text-anchor="end">C = pusat kelengkungan, berjarak 2f</text>

  <!-- sumbu utama -->
  <line class="ax" x1="40" y1="190" x2="492" y2="190"/>
  <text class="ts" x="42" y="183">sumbu utama</text>

  <!-- cermin cekung: busur lingkaran R = 160, pusat di C(330,190), puncak di (490,190) -->
  <path class="ln" d="M 454.9,90 A 160,160 0 0 1 454.9,290" stroke-width="2.5"/>
  <text class="ts" x="500" y="94">cermin cekung</text>

  <!-- titik fokus F dan pusat kelengkungan C -->
  <circle cx="410" cy="190" r="4" fill="#d97757"/>
  <text class="tb" x="410" y="176" text-anchor="middle">F</text>
  <circle cx="330" cy="190" r="4" fill="#d97757"/>
  <text class="tb" x="330" y="210" text-anchor="middle">C</text>

  <!-- benda (h = 60, s = 320 = 4f) -->
  <line x1="170" y1="190" x2="170" y2="140" stroke="#7fb069" stroke-width="2" marker-end="url(#vg-si)"/>
  <text class="ts" x="160" y="138" text-anchor="end">benda</text>

  <!-- ============ SINAR 1: sejajar sumbu utama &#8594; dipantulkan lewat F ============ -->
  <line class="vd" x1="170" y1="140" x2="480" y2="140"/>
  <line class="fa" x1="482" y1="140" x2="370" y2="219.4"/>
  <circle cx="330" cy="140" r="9" fill="#1c1b19" stroke="#d97757" stroke-width="1.4"/>
  <text class="acc" x="330" y="144.5" text-anchor="middle" style="font-size:11px">1</text>

  <!-- ============ SINAR 2: datang lewat F &#8594; dipantulkan sejajar sumbu ============ -->
  <line class="vd" x1="170" y1="140" x2="488" y2="206.4"/>
  <line class="fa" x1="487" y1="206.5" x2="360" y2="206.5"/>
  <circle cx="300" cy="167" r="9" fill="#1c1b19" stroke="#d97757" stroke-width="1.4"/>
  <text class="acc" x="300" y="171.5" text-anchor="middle" style="font-size:11px">2</text>

  <!-- ============ SINAR 3: datang lewat C &#8594; dipantulkan balik ke arah benda ============ -->
  <line class="vd" x1="162" y1="137.5" x2="482" y2="237.6"/>
  <line x1="420" y1="218" x2="372" y2="202.4" stroke="#d97757" stroke-width="1.8" marker-end="url(#fa-si)"/>
  <circle cx="430" cy="221" r="9" fill="#1c1b19" stroke="#d97757" stroke-width="1.4"/>
  <text class="acc" x="430" y="225.5" text-anchor="middle" style="font-size:11px">3</text>

  <!-- titik bayangan: ketiga sinar berpotongan di sini -->
  <circle cx="383.3" cy="206.5" r="2.5" fill="#e8b86d"/>
  <line x1="383.3" y1="190" x2="383.3" y2="204" stroke="#e8b86d" stroke-width="1.6" marker-end="url(#va-si)"/>
  <text class="t" x="372" y="199" text-anchor="end" style="font-size:12px;fill:#e8b86d;font-weight:600">I&#8242;</text>

  <!-- keterangan sinar -->
  <circle cx="38" cy="300" r="8" fill="#1c1b19" stroke="#d97757" stroke-width="1.2"/>
  <text class="t" x="38" y="304" text-anchor="middle" style="font-size:11px">1</text>
  <text class="t" x="52" y="304" style="font-size:11px">1. sejajar &#8594; F</text>
  <circle cx="38" cy="314" r="8" fill="#1c1b19" stroke="#d97757" stroke-width="1.2"/>
  <text class="t" x="38" y="318" text-anchor="middle" style="font-size:11px">2</text>
  <text class="t" x="52" y="318" style="font-size:11px">2. lewat F &#8594; sejajar</text>
  <circle cx="38" cy="328" r="8" fill="#1c1b19" stroke="#d97757" stroke-width="1.2"/>
  <text class="t" x="38" y="332" text-anchor="middle" style="font-size:11px">3</text>
  <text class="t" x="52" y="332" style="font-size:11px">3. lewat C &#8594; balik</text>

  <text class="ts" x="575" y="316" text-anchor="end">sinar 3 kembali tepat ke arah benda</text>
  <text class="ts" x="575" y="332" text-anchor="end">bayangan nyata: tidak perlu perpanjangan ke belakang cermin</text>
</svg>