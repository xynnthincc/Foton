<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="Diagram tekanan-volume siklus mesin empat langkah yang searah jarum jam, dengan kalor masuk Q_in, kalor keluar Q_out, dan usaha W sebagai luas di dalam siklus">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-ts); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-ts); }
      .hs  { stroke: #e8b86d; stroke-width: 1.8; marker-end: url(#va-ts); }
      .ext { stroke: #7fb069; stroke-width: 1.8; marker-end: url(#vg-ts); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <marker id="vb-ts" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-ts" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="va-ts" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
    <marker id="vg-ts" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
  </defs>

  <text class="tb" x="20" y="26">Siklus mesin pada diagram p - V</text>

  <!-- sumbu p dan V -->
  <line class="ax" x1="60" y1="290" x2="572" y2="290"/>
  <line class="ax" x1="60" y1="290" x2="60" y2="58"/>
  <polygon points="580,290 571,286 571,294" fill="#8a857d"/>
  <polygon points="60,48 56,57 64,57" fill="#8a857d"/>
  <text class="t" x="586" y="294">V</text>
  <text class="t" x="60" y="42" text-anchor="middle">p</text>
  <line class="dim" x1="170" y1="286" x2="170" y2="294"/>
  <line class="dim" x1="206" y1="286" x2="206" y2="294"/>
  <line class="dim" x1="446" y1="286" x2="446" y2="294"/>
  <line class="dim" x1="488" y1="286" x2="488" y2="294"/>
  <line class="dim" x1="56" y1="118" x2="64" y2="118"/>
  <line class="dim" x1="56" y1="226" x2="64" y2="226"/>

  <!-- siklus: 1 (kiri bawah) -> 2 (kiri atas) -> 3 (kanan atas) -> 4 (kanan bawah) -->
  <path class="ln" d="M 206,226 L 170,118 L 446,118 L 488,226 Z"/>
  <circle cx="206" cy="226" r="3.5" fill="#e5e0d6"/>
  <circle cx="170" cy="118" r="3.5" fill="#e5e0d6"/>
  <circle cx="446" cy="118" r="3.5" fill="#e5e0d6"/>
  <circle cx="488" cy="226" r="3.5" fill="#e5e0d6"/>
  <text class="acc" x="198" y="246" text-anchor="middle">1</text>
  <text class="acc" x="160" y="110" text-anchor="middle">2</text>
  <text class="acc" x="456" y="110" text-anchor="middle">3</text>
  <text class="acc" x="496" y="246" text-anchor="middle">4</text>

  <!-- arah tiap proses (searah jarum jam) -->
  <line class="vd" x1="197" y1="199" x2="186" y2="166"/>
  <line class="hs" x1="280" y1="118" x2="330" y2="118"/>
  <line class="hs" x1="457" y1="146" x2="469" y2="178"/>
  <line class="vd" x1="430" y1="226" x2="380" y2="226"/>

  <!-- nama proses -->
  <text class="t" x="308" y="102" text-anchor="middle">ekspansi</text>
  <text class="t" x="186" y="142">adibi</text>
  <text class="t" x="186" y="160">(kompresi)</text>
  <text class="t" x="496" y="166">adiahu</text>
  <text class="t" x="496" y="184">(ekspansi)</text>
  <text class="t" x="326" y="250" text-anchor="middle">kompresi</text>

  <!-- kalor masuk dan keluar -->
  <line class="hs" x1="250" y1="62" x2="250" y2="104"/>
  <text class="acc" x="258" y="78">Q_in</text>
  <line class="vd" x1="280" y1="236" x2="280" y2="282"/>
  <text class="acc" x="288" y="270">Q_out</text>

  <!-- usaha = luas di dalam siklus -->
  <text x="326" y="182" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;font-weight:700;fill:#6ba3c0">W</text>
  <text class="ts" x="326" y="202" text-anchor="middle" style="fill:#6ba3c0">W = luas siklus</text>

  <!-- kesimpulan -->
  <text class="acc" x="20" y="314">W = Q_in - Q_out (luar = luas siklus)</text>
  <text class="acc" x="350" y="314">η = W / Q_in</text>
  <text class="ts" x="20" y="332">siklus searah jarum jam -&gt; W netto positif (motor)</text>
  <text class="ts" x="350" y="332">syarat: Q_in &gt; Q_out</text>
</svg>
