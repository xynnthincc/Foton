<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img"
     aria-label="Grafik gaya terhadap perpindahan F-s dengan luas sama dengan usaha, dan diagram energi Ep menjadi Ek">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-usaha); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-usaha); }
      .hs  { stroke: #e8b86d; stroke-width: 1.8; marker-end: url(#va-usaha); }
      .ext { stroke: #7fb069; stroke-width: 1.8; marker-end: url(#vg-usaha); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <marker id="vb-usaha" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-usaha" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="va-usaha" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
    <marker id="vg-usaha" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
  </defs>

  <!-- ================= PANEL KIRI: GRAFIK F - s ================= -->
  <text class="acc" x="16" y="22">Grafik F – s</text>

  <path class="ax" d="M 58,200 H 270"/>
  <path class="ax" d="M 58,200 V 52"/>
  <text class="tb" x="50" y="48" text-anchor="end">F</text>
  <text class="tb" x="276" y="214">s</text>
  <text class="ts" x="54" y="214" text-anchor="end">0</text>

  <!-- gaya konstan -->
  <line class="fa" x1="58" y1="92" x2="208" y2="92"/>
  <text class="acc" x="214" y="96">F (konstan)</text>

  <!-- luas di bawah garis = usaha -->
  <rect x="58" y="92" width="150" height="108" fill="#e8b86d" fill-opacity="0.28" stroke="#e8b86d" stroke-width="1.5"/>
  <text class="acc" x="133" y="146" text-anchor="middle">W = F · s</text>
  <line x1="208" y1="92" x2="208" y2="200" stroke="#e8b86d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="204" y1="196" x2="212" y2="204" stroke="#8a857d" stroke-width="1"/>

  <text class="ts" x="16" y="222">F konstan → luas = F · s</text>
  <text class="ts" x="16" y="238">satuan usaha = joule (J)</text>

  <!-- ================= PANEL KANAN: DIAGRAM ENERGI ================= -->
  <text class="acc" x="312" y="22">Diagram energi (tanpa gesekan)</text>

  <!-- tanah -->
  <line x1="312" y1="126" x2="586" y2="126" stroke="#8a857d" stroke-width="1.5"/>

  <!-- keadaan awal: balok setinggi h -->
  <text class="ts" x="349" y="58" text-anchor="middle">awal</text>
  <rect x="330" y="64" width="38" height="26" fill="#3a3835" stroke="#7fb069" stroke-width="1.8"/>
  <text class="tb" x="349" y="82" text-anchor="middle">m</text>
  <line class="hs" x1="322" y1="122" x2="322" y2="94"/>
  <text class="ts" x="314" y="112" text-anchor="end">h</text>
  <path class="ax" d="M 349,92 V 124"/>
  <text class="ts" x="356" y="116">jatuh</text>

  <!-- keadaan akhir: di tanah dengan kecepatan v -->
  <text class="ts" x="449" y="94" text-anchor="middle">akhir</text>
  <rect x="430" y="100" width="38" height="26" fill="none" stroke="#6ba3c0" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line class="vd" x1="468" y1="113" x2="516" y2="113"/>
  <text class="t" x="522" y="117">v</text>

  <!-- batang energi: Ep awal -> Ek akhir -->
  <path class="ax" d="M 306,144 V 202"/>
  <text class="ts" x="298" y="178" text-anchor="middle" transform="rotate(-90 298 178)">energi</text>

  <text class="tb" x="312" y="146">Ep + Ek = konstan</text>
  <rect x="310" y="154" width="170" height="18" fill="#e8b86d"/>
  <rect x="310" y="178" width="170" height="18" fill="#6ba3c0"/>
  <path class="ax" d="M 486,154 V 196"/>
  <text class="tb" x="492" y="167">Ep awal = mgh</text>
  <text class="tb" x="492" y="191">Ek akhir = ½mv²</text>

  <text class="ts" x="310" y="216">Ep → 0 saat mencapai tanah</text>
  <text class="ts" x="310" y="232">Ek akhir = energi potensial awal</text>
</svg>