<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="Hukum Coulomb pada dua muatan titik berlawanan tanda: gaya F12 pada q1 dan gaya F21 pada q2 sama besar dan berlawanan arah, jarak r12">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-lsc); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-lsc); }
      .hs  { stroke: #e8b86d; stroke-width: 1.8; marker-end: url(#va-lsc); }
      .ext { stroke: #7fb069; stroke-width: 1.8; marker-end: url(#vg-lsc); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <marker id="vb-lsc" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-lsc" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="va-lsc" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
    <marker id="vg-lsc" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
  </defs>

  <text class="tb" x="20" y="26">Hukum Coulomb dua muatan titik</text>
  <text class="ts" x="300" y="58" text-anchor="middle">gaya berbanding lurus dengan q1 x q2</text>
  <text class="ts" x="300" y="76" text-anchor="middle">dan berbanding terbalik dengan kuadrat jarak</text>
  <text class="ts" x="20" y="230">konstanta Coulomb: k</text>

  <!-- muatan titik -->
  <circle cx="150" cy="170" r="22" fill="#c97064"/>
  <text x="150" y="175" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;font-weight:700;fill:#e5e0d6">+q₁</text>
  <circle cx="450" cy="170" r="22" fill="#6ba3c0"/>
  <text x="450" y="175" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;font-weight:700;fill:#e5e0d6">−q₂</text>

  <!-- tanda muatan berlawanan -> tarik-menarik: F12 ke kanan, F21 ke kiri -->
  <line class="fa" x1="172" y1="170" x2="250" y2="170"/>
  <text class="acc" x="211" y="160" text-anchor="middle">F₁₂</text>
  <text class="ts" x="211" y="190" text-anchor="middle">pada q₁</text>

  <line class="fa" x1="428" y1="170" x2="356" y2="170"/>
  <text class="acc" x="389" y="160" text-anchor="middle">F₂₁</text>
  <text class="ts" x="389" y="190" text-anchor="middle">pada q₂</text>

  <!-- titik uji netral di tengah -->
  <circle cx="300" cy="170" r="9" fill="#e5e0d6"/>
  <line class="vd" x1="312" y1="170" x2="344" y2="170"/>
  <text class="t" x="328" y="160" text-anchor="middle" style="fill:#6ba3c0">E</text>
  <text class="acc" x="300" y="196" text-anchor="middle">q₀</text>

  <!-- jarak antara kedua muatan -->
  <line class="dim" x1="150" y1="192" x2="150" y2="216"/>
  <line class="dim" x1="450" y1="192" x2="450" y2="216"/>
  <line class="dim" x1="150" y1="212" x2="450" y2="212"/>
  <text class="ts" x="300" y="228" text-anchor="middle">r₁₂ = jarak kedua muatan</text>

  <text class="t" x="300" y="252" text-anchor="middle">tanda berlawanan (+, -) -&gt; tarik-menarik</text>

  <!-- rumus -->
  <text class="acc" x="20" y="290">F₁₂ = k |q₁ q₂| / r₁₂²</text>
  <text class="acc" x="20" y="312">F₁₂ = −F₂₁</text>
  <text class="t" x="300" y="290">gaya sama besar, arah berlawanan</text>
  <text class="t" x="300" y="312">Hukum Newton III</text>
  <text class="ts" x="20" y="332">catatan: jika q₁ dan q₂ sepi -&gt; tolak-menolak, F₁₂ ke kiri dan F₂₁ ke kanan</text>
</svg>
