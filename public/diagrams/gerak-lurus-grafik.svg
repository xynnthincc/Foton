<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img"
     aria-label="Dua grafik gerak lurus: grafik posisi-waktu s-t dan grafik kecepatan-waktu v-t">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-gl); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-gl); }
      .hs  { stroke: #e8b86d; stroke-width: 1.8; marker-end: url(#va-gl); }
      .ext { stroke: #7fb069; stroke-width: 1.8; marker-end: url(#vg-gl); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <marker id="vb-gl" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-gl" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="va-gl" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
    <marker id="vg-gl" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
  </defs>

  <!-- ================= PANEL KIRI: GRAFIK s - t ================= -->
  <text class="acc" x="16" y="24">Grafik s – t</text>
  <text class="ts" x="66" y="54">s = ½ a t²</text>

  <!-- sumbu -->
  <path class="ax" d="M 58,206 H 272"/>
  <path class="ax" d="M 58,206 V 48"/>
  <text class="tb" x="48" y="46" text-anchor="end">s</text>
  <text class="tb" x="278" y="212">t</text>
  <text class="ts" x="54" y="214" text-anchor="end">0</text>

  <!-- lintasan: gerak dipercepat (parabola naik) -->
  <path class="ln" d="M58,206 L77,204.6 L96,200.4 L115,193.4 L134,183.6 L153,171 L172,155.6 L191,137.4 L210,116.4 L229,92.6 L248,66"/>

  <!-- segitiga gradien: Δt mendatar, Δs tegak -->
  <path class="ax" d="M 210,116.4 V 206"/>
  <path class="ax" d="M 58,116.4 H 210"/>
  <text class="ts" x="64" y="110">Δs</text>

  <!-- titik berlabel t0 dan t1 -->
  <circle cx="58" cy="206" r="4" fill="#d97757"/>
  <circle cx="210" cy="116.4" r="4" fill="#d97757"/>
  <text class="ts" x="58" y="224" text-anchor="middle">t₀</text>
  <text class="ts" x="134" y="224" text-anchor="middle">Δt</text>
  <text class="ts" x="210" y="224" text-anchor="middle">t₁</text>

  <!-- garis hubung t0-t1: gradiennya adalah kecepatan rata-rata -->
  <line x1="58" y1="206" x2="210" y2="116.4" stroke="#d97757" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text class="acc" x="96" y="152" transform="rotate(-30.5 96 152)">gradien = v rata-rata</text>

  <text class="ts" x="16" y="242">gradien grafik s – t = besar kecepatan</text>

  <!-- ================= PANEL KANAN: GRAFIK v - t ================= -->
  <text class="acc" x="306" y="24">Grafik v – t</text>

  <path class="ax" d="M 348,206 H 562"/>
  <path class="ax" d="M 348,206 V 48"/>
  <text class="tb" x="338" y="46" text-anchor="end">v</text>
  <text class="tb" x="568" y="212">t</text>
  <text class="ts" x="352" y="224">v₀ = 0</text>

  <!-- luas segitiga di bawah garis = perpindahan -->
  <path d="M 348,206 L 562,206 L 562,76 Z" fill="#e8b86d" fill-opacity="0.28" stroke="#e8b86d" stroke-width="1.5"/>

  <!-- garis lurus naik = percepatan konstan -->
  <line class="vd" x1="348" y1="206" x2="568" y2="72.3"/>
  <text class="t" x="572" y="68">v</text>

  <text class="ts" x="356" y="66">percepatan konstan → garis lurus</text>
  <text class="acc" x="356" y="84">gradien = percepatan a</text>
  <text class="acc" x="398" y="194">perpindahan (s)</text>

  <text class="ts" x="306" y="242">luas di bawah garis = perpindahan (s)</text>
</svg>