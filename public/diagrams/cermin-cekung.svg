<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Cermin cekung dengan titik fokus dan pusat kelengkungan">
  <defs>
    <style>
      .txt { font-family: system-ui, sans-serif; font-size: 13px; fill: #e5e0d6; }
      .txtb { font-family: system-ui, sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .axis { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 6 4; }
      .mirror { fill: none; stroke: #e5e0d6; stroke-width: 2.5; }
      .ray { stroke: #6ba3c0; stroke-width: 1.6; marker-end: url(#arrow); }
      .ref { stroke: #d97757; stroke-width: 1.6; marker-end: url(#arrowR); }
      .pt { fill: #d97757; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6ba3c0" />
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97757" />
    </marker>
  </defs>

  <!-- optical axis -->
  <line class="axis" x1="20" y1="160" x2="580" y2="160" />
  <text class="txt" x="555" y="150">sumbu utama</text>

  <!-- mirror (curves toward object) -->
  <path class="mirror" d="M 520,60 C 500,110 500,210 520,260" />
  <text class="txt" x="525" y="55">cermin</text>

  <!-- points F and C -->
  <circle class="pt" cx="460" cy="160" r="4" />
  <text class="txtb" x="452" y="185">F</text>
  <circle class="pt" cx="400" cy="160" r="4" />
  <text class="txtb" x="392" y="185">C</text>

  <!-- object arrow -->
  <line stroke="#7fb069" stroke-width="2" x1="120" y1="160" x2="120" y2="80" />
  <polygon points="114,86 120,74 126,86" fill="#7fb069" />
  <text class="txt" x="105" y="72">benda</text>

  <!-- ray 1: parallel -> goes through F (incoming from left, parallel to axis) -->
  <line class="ray" x1="120" y1="80" x2="500" y2="80" />
  <line class="ref" x1="500" y1="80" x2="460" y2="160" />
  <!-- extend reflected ray (dashed) toward image -->
  <line stroke="#d97757" stroke-width="1.6" stroke-dasharray="5 3" x1="460" y1="160" x2="250" y2="240" />

  <!-- ray 2: through F -> reflects parallel -->
  <line class="ray" x1="120" y1="80" x2="460" y2="160" />
  <line stroke="#d97757" stroke-width="1.6" x1="460" y1="160" x2="500" y2="160" marker-end="url(#arrowR)" />

  <!-- labels -->
  <text class="txt" x="15" y="100">sinar datang</text>
  <text class="txt" x="505" y="72">sinar pantul</text>
</svg>
