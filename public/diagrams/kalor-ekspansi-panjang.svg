<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="Ekspansi panjang batang: panjang awal L0 sebelum dipanaskan dan panjang L sesudah dipanaskan dengan pertambahan panjang delta L">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-kep); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-kep); }
      .hs  { stroke: #e8b86d; stroke-width: 1.8; marker-end: url(#va-kep); }
      .ext { stroke: #7fb069; stroke-width: 1.8; marker-end: url(#vg-kep); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <marker id="vb-kep" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-kep" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="va-kep" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
    <marker id="vg-kep" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
  </defs>

  <text class="tb" x="20" y="26">Ekspansi panjang batang</text>
  <text class="ts" x="20" y="58">suhu awal T1</text>
  <text class="ts" x="452" y="26">L₀ = panjang mula-mula</text>

  <!-- batang sebelum dipanaskan -->
  <rect x="60" y="80" width="300" height="26" fill="#6ba3c0" stroke="#e5e0d6" stroke-width="1"/>
  <text class="t" x="60" y="72">panjang awal L₀</text>
  <line class="vd" x1="24" y1="93" x2="52" y2="93"/>
  <text class="acc" x="39" y="84" text-anchor="middle" style="fill:#6ba3c0">T1</text>
  <text class="t" x="368" y="98">batang sebelum</text>

  <!-- garis dimensi L0 -->
  <line class="dim" x1="60" y1="106" x2="60" y2="118"/>
  <line class="dim" x1="360" y1="106" x2="360" y2="118"/>
  <line class="dim" x1="60" y1="116" x2="360" y2="116"/>
  <text class="ts" x="210" y="134" text-anchor="middle">L₀</text>

  <!-- batang sesudah dipanaskan -->
  <text class="t" x="60" y="188">batang sesudah (memanjang)</text>
  <text class="ts" x="20" y="176">suhu akhir T2</text>
  <rect x="60" y="196" width="360" height="26" fill="#e8b86d" stroke="#e5e0d6" stroke-width="1"/>
  <line class="hs" x1="24" y1="209" x2="52" y2="209"/>
  <text class="acc" x="39" y="200" text-anchor="middle" style="fill:#e8b86d">T2</text>

  <!-- garis bantu: ujung lama (360) dan ujung baru (420) -->
  <line class="dim" x1="360" y1="222" x2="360" y2="272"/>
  <line class="dim" x1="420" y1="222" x2="420" y2="272"/>
  <line class="dim" x1="60" y1="222" x2="60" y2="268"/>

  <!-- pertambahan panjang dL dari ujung lama ke ujung baru -->
  <line class="fa" x1="360" y1="236" x2="420" y2="236"/>
  <line class="fa" x1="420" y1="236" x2="360" y2="236"/>
  <text class="acc" x="390" y="232" text-anchor="middle">ΔL</text>

  <!-- arah memanjang di ujung kanan -->
  <line class="fa" x1="434" y1="209" x2="482" y2="209"/>
  <text class="ts" x="490" y="213">memanjang</text>

  <!-- garis dimensi panjang akhir L -->
  <line class="dim" x1="60" y1="264" x2="420" y2="264"/>
  <line class="dim" x1="60" y1="260" x2="60" y2="268"/>
  <line class="dim" x1="420" y1="260" x2="420" y2="268"/>
  <text class="ts" x="240" y="284" text-anchor="middle">L</text>
  <text class="ts" x="446" y="268">ΔT besar -&gt; ΔL besar</text>

  <!-- rumus -->
  <text class="acc" x="60" y="310">L = L₀ (1 + α ΔT)</text>
  <text class="acc" x="60" y="332">ΔL = α L₀ ΔT</text>
  <text class="ts" x="300" y="310">ΔT = T₂ − T₁</text>
  <text class="ts" x="300" y="332">α = koefisien muai panjang</text>
</svg>
