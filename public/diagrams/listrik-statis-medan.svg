<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="Medan listrik antara muatan positif +q dan muatan negatif minus q, garis medan keluar dari muatan positif dan masuk ke muatan negatif, titik uji q0 negatif mendapat gaya F berlawanan arah dengan medan E">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-lsm); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-lsm); }
      .hs  { stroke: #e8b86d; stroke-width: 1.8; marker-end: url(#va-lsm); }
      .ext { stroke: #7fb069; stroke-width: 1.8; marker-end: url(#vg-lsm); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <marker id="vb-lsm" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-lsm" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
    <marker id="va-lsm" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b86d"/>
    </marker>
    <marker id="vg-lsm" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7fb069"/>
    </marker>
  </defs>

  <text class="tb" x="20" y="26">Medan listrik dua muatan titik</text>
  <text class="ts" x="176" y="44">garis medan listrik E</text>

  <!-- garis medan: keluar dari +q, masuk ke -q -->
  <g fill="none" stroke="#9b8ec4" stroke-width="1.6">
    <path d="M 152,75 Q 300,15 448,75"/>
    <path d="M 152,103 Q 300,51 448,103"/>
    <path d="M 152,137 Q 300,97 448,137"/>
    <path d="M 152,175 L 448,175"/>
    <path d="M 152,213 Q 300,253 448,213"/>
    <path d="M 152,247 Q 300,299 448,247"/>
    <path d="M 152,275 Q 300,335 448,275"/>
  </g>
  <!-- arah tiap garis medan (keluar dari +, masuk ke -) -->
  <g fill="#9b8ec4">
    <polygon points="300,45 291,40.5 291,49.5"/>
    <polygon points="300,77 291,72.5 291,81.5"/>
    <polygon points="300,117 291,112.5 291,121.5"/>
    <polygon points="300,175 291,170.5 291,179.5"/>
    <polygon points="300,233 291,228.5 291,237.5"/>
    <polygon points="300,273 291,268.5 291,277.5"/>
    <polygon points="300,305 291,300.5 291,309.5"/>
  </g>

  <!-- muatan sumber -->
  <circle cx="130" cy="175" r="20" fill="#c97064"/>
  <text x="130" y="180" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;font-weight:700;fill:#e5e0d6">+q</text>
  <circle cx="470" cy="175" r="20" fill="#6ba3c0"/>
  <text x="470" y="180" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;font-weight:700;fill:#e5e0d6">−q</text>

  <!-- titik uji q0 (negatif) -->
  <circle cx="300" cy="175" r="8" fill="#e5e0d6"/>
  <text class="acc" x="300" y="158" text-anchor="middle">q₀</text>
  <text class="ts" x="300" y="192" text-anchor="middle">q₀ negatif</text>

  <!-- gaya pada q0 berlawanan arah dengan medan E -->
  <line class="vd" x1="314" y1="175" x2="356" y2="175"/>
  <text class="t" x="335" y="164" text-anchor="middle" style="fill:#6ba3c0">E</text>
  <line class="fa" x1="292" y1="175" x2="240" y2="175"/>
  <text class="acc" x="266" y="164" text-anchor="middle">F</text>

  <!-- jarak r dari +q ke titik uji -->
  <line class="dim" x1="130" y1="200" x2="130" y2="210"/>
  <line class="dim" x1="300" y1="200" x2="300" y2="210"/>
  <line class="dim" x1="130" y1="206" x2="300" y2="206"/>
  <text class="ts" x="215" y="201" text-anchor="middle">r</text>

  <!-- ringkasan -->
  <text class="t" x="20" y="300">arah medan: dari +q ke −q</text>
  <text class="acc" x="20" y="322">E = k q / r²</text>
  <text class="acc" x="140" y="322">F = q₀ E</text>
  <text class="ts" x="330" y="322">q₀ negatif -&gt; F berlawanan dengan E</text>
</svg>
