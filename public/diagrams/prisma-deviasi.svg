<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"
     aria-label="Deviasi cahaya pada prisma segitiga sama sisi: sudut i, r1, r2, e, dan sudut deviasi D">
  <defs>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; }
      .tb  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #e5e0d6; font-weight: 700; }
      .ts  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #8a857d; }
      .acc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d97757; font-weight: 600; }
      .ax  { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 5 4; }
      .ln  { stroke: #e5e0d6; stroke-width: 2; fill: none; }
      .dim { stroke: #8a857d; stroke-width: 1; fill: none; }
      .vd  { stroke: #6ba3c0; stroke-width: 1.8; marker-end: url(#vb-pd); }
      .fa  { stroke: #d97757; stroke-width: 1.8; marker-end: url(#fa-pd); }
      .gh  { stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .gb  { stroke: #6ba3c0; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <marker id="vb-pd" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6ba3c0"/>
    </marker>
    <marker id="fa-pd" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97757"/>
    </marker>
  </defs>

  <text class="tb" x="24" y="26">Deviasi cahaya pada prisma segitiga sama sisi</text>
  <text class="ts" x="24" y="44">n = 1,50, A = 60&#176;, syarat deviasi minimum (sinar datang dan keluar simetris)</text>
  <text class="ts" x="24" y="60">D = sudut antara sinar keluar dan perpanjangan arah sinar datang</text>

  <!-- prisma segitiga sama sisi -->
  <polygon points="300,70 186.07,280 413.93,280" fill="#2a2926" stroke="#e5e0d6" stroke-width="2"/>
  <text class="ts" x="300" y="258" text-anchor="middle">prisma</text>

  <!-- sudut puncak A -->
  <path d="M 265.4,90 A 40,40 0 0 0 334.6,90" fill="none" stroke="#8a857d" stroke-width="1.2"/>
  <text class="tb" x="300" y="78" text-anchor="middle">A</text>

  <!-- normal pada muka pertama (garis putus-putus) -->
  <line class="ax" x1="125.5" y1="234.5" x2="246.7" y2="164.5"/>
  <text class="ts" x="122" y="243" text-anchor="end">normal</text>
  <!-- normal pada muka kedua -->
  <line class="ax" x1="314.2" y1="164.5" x2="435.4" y2="234.5"/>
  <text class="ts" x="440" y="243">normal</text>

  <!-- sinar datang -->
  <line class="vd" x1="40" y1="248.7" x2="186" y2="199.5"/>
  <text class="t" x="55" y="275">sinar datang</text>

  <!-- perpanjangan arah sinar datang (garis putus-putus) -->
  <line class="gb" x1="186" y1="199.5" x2="366.1" y2="138.9"/>
  <text class="ts" x="374" y="132">perpanjangan arah datang</text>

  <!-- di dalam prisma -->
  <line x1="186" y1="199.5" x2="374.8" y2="199.5" stroke="#6ba3c0" stroke-width="2.4"/>
  <text class="ts" x="235" y="192" text-anchor="middle">di dalam prisma</text>

  <!-- sinar keluar -->
  <line class="vd" x1="374.8" y1="199.5" x2="554.9" y2="260.1"/>
  <text class="t" x="458" y="258" text-anchor="middle">sinar keluar</text>

  <!-- sudut i (datang) -->
  <path d="M 148.2,212.3 A 40,40 0 0 1 151.4,179.5" fill="none" stroke="#8a857d" stroke-width="1.2"/>
  <text class="tb" x="131" y="199">i</text>
  <!-- sudut r1 (muka pertama) -->
  <path d="M 226.1,199.5 A 40,40 0 0 1 220.7,219.5" fill="none" stroke="#8a857d" stroke-width="1.2"/>
  <text class="tb" x="240" y="216">r1</text>
  <!-- sudut r2 (muka kedua) -->
  <path d="M 409.4,179.5 A 40,40 0 0 1 414.8,199.5" fill="none" stroke="#8a857d" stroke-width="1.2"/>
  <text class="tb" x="425" y="186">r2</text>
  <!-- sudut e (keluar) -->
  <path d="M 435.4,164.5 A 70,70 0 0 1 441.1,221.8" fill="none" stroke="#8a857d" stroke-width="1.2"/>
  <text class="tb" x="459" y="192">e</text>

  <!-- sudut deviasi D -->
  <path d="M 516.9,151.7 A 150,150 0 0 1 516.9,247.3" fill="none" stroke="#d97757" stroke-width="1.4"/>
  <text class="acc" x="543" y="204" style="font-size:15px">D</text>

  <!-- hubungan dan rumus -->
  <text class="acc" x="300" y="302" text-anchor="middle" style="font-size:15px">A = r1 + r2 ,  D = i + e - A</text>
  <text class="t" x="300" y="324" text-anchor="middle">D_min = 2 &#183; arcsin(n &#183; sin(A/2)) - A</text>
  <text class="ts" x="576" y="302" text-anchor="end">i = e = 48,6&#176;; r1 = r2 = 30&#176;; D = 37,2&#176;</text>
</svg>