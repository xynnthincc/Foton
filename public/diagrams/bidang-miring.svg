<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Bidang miring dengan vektor gaya">
  <defs>
    <style>
      .txt { font-family: system-ui, sans-serif; font-size: 13px; fill: #e5e0d6; }
      .plane { fill: none; stroke: #e5e0d6; stroke-width: 2; }
      .blk { fill: #3a3835; stroke: #e5e0d6; stroke-width: 1.5; }
      .vec { stroke: #d97757; stroke-width: 2; marker-end: url(#a); }
      .axis { stroke: #8a857d; stroke-width: 1; stroke-dasharray: 4 3; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d97757" /></marker>
  </defs>

  <!-- horizontal ground line -->
  <line stroke="#494643" stroke-width="1" x1="0" y1="260" x2="520" y2="260" />

  <!-- inclined plane (right triangle) -->
  <polygon class="plane" points="60,260 440,260 440,100" fill="none" />

  <!-- block -->
  <rect class="blk" x="230" y="155" width="46" height="32" rx="3" />
  <text class="txt" x="240" y="175">m</text>

  <!-- angle theta -->
  <path fill="none" stroke="#8a857d" stroke-width="1.2" d="M 395,260 A 45 45 0 0 0 405,235" />
  <text class="txt" x="360" y="245">θ</text>

  <!-- weight mg downward from block center -->
  <line class="vec" x1="253" y1="171" x2="253" y2="240" />
  <text class="txt" x="260" y="240">mg</text>

  <!-- mg cos theta (into plane / perpendicular) -->
  <line stroke="#6ba3c0" stroke-width="1.8" stroke-dasharray="5 3" x1="253" y1="171" x2="288" y2="240" />
  <text class="txt" x="290" y="220">mg cosθ</text>

  <!-- mg sin theta (down along plane) -->
  <line stroke="#7fb069" stroke-width="1.8" x1="253" y1="171" x2="300" y2="205" />
  <text class="txt" x="306" y="205">mg sinθ</text>

  <text class="txt" x="20" y="30">Komponen berat pada bidang miring:</text>
  <text class="txt" x="20" y="50">mg sinθ — sejajar bidang (menyebabkan percepatan)</text>
  <text class="txt" x="20" y="70">mg cosθ — tegak lurus bidang (gaya normal N)</text>
</svg>
